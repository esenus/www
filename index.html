<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>esenus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #e7f0f4;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    /* =========================================================
       Scene
       ========================================================= */

    .scene {
      position: relative;

      width: 100%;
      height: 100svh;
      min-height: 520px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #eaf2f5 0%,
          #e5eef2 27%,
          #e0ebef 48%,
          #dce9ee 100%
        );
    }

    /* =========================================================
       Atmosphere
       ========================================================= */

    .atmosphere {
      position: absolute;
      inset: 0;

      z-index: 1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 38%,
          rgba(255,255,255,0.56) 0%,
          rgba(255,255,255,0.26) 27%,
          rgba(255,255,255,0) 65%
        );

      animation:
        atmosphereBreath 12s ease-in-out infinite;
    }

    @keyframes atmosphereBreath {
      0%,
      100% {
        opacity: .72;
        transform: scale(1);
      }

      50% {
        opacity: .92;
        transform: scale(1.025);
      }
    }

    /* =========================================================
       Island window
       
       円のサイズは画面幅に応じて変化。
       円の上側20%だけを見せる窓。
       ========================================================= */

    .island-window {
      position: absolute;

      left: 50%;
      top: calc(37.5vh - clamp(20px, 3.6vw, 36px));

      width: clamp(100px, 18vw, 180px);
      height: clamp(20px, 3.6vw, 36px);

      transform: translateX(-50%);

      z-index: 10;

      overflow: hidden;

      pointer-events: none;
    }

    /* =========================================================
       Island
       ========================================================= */

    .island {
      position: absolute;

      left: 0;
      top: 0;

      width: clamp(100px, 18vw, 180px);
      height: clamp(100px, 18vw, 180px);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 50% 100%,
          rgba(54,91,98,.24) 0%,
          rgba(61,98,105,.20) 42%,
          rgba(74,110,116,.14) 66%,
          rgba(92,126,131,.06) 84%,
          rgba(105,137,141,0) 100%
        );

      filter:
        blur(.6px)
        saturate(.72);

      opacity: .82;

      animation:
        islandDrift 14s ease-in-out infinite;
    }

    @keyframes islandDrift {

      0%,
      100% {
        transform: scaleX(.995);
      }

      25% {
        transform: scaleX(1.012);
      }

      50% {
        transform: scaleX(.998);
      }

      75% {
        transform: scaleX(1.008);
      }
    }

    /* =========================================================
       Island upper haze
       ========================================================= */

    .island::before {
      content: "";

      position: absolute;

      left: 3%;
      right: 3%;
      top: 1%;

      height: 42%;

      border-radius:
        50%
        50%
        35%
        35% / 90%
        90%
        35%
        35%;

      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(48,85,92,.15) 0%,
          rgba(57,94,101,.11) 42%,
          rgba(77,114,120,.045) 68%,
          rgba(105,137,141,0) 100%
        );

      filter: blur(.8px);

      opacity: .85;
    }

    /* =========================================================
       Island lower haze
       ========================================================= */

    .island::after {
      content: "";

      position: absolute;

      left: -8%;
      right: -8%;
      bottom: 8px;

      height: 34%;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 50% 30%,
          rgba(237,246,248,.14) 0%,
          rgba(237,246,248,.055) 42%,
          rgba(237,246,248,0) 82%
        );

      filter: blur(5px);

      opacity: .78;
    }

    /* =========================================================
       Gap between island and horizon
       ========================================================= */

    .island-gap-mist {
      position: absolute;

      left: 50%;
      top: calc(37.5vh - 1px);

      width: clamp(124px, 23vw, 230px);
      height: 10px;

      transform: translateX(-50%);

      z-index: 9;

      pointer-events: none;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(238,247,249,.08) 0%,
          rgba(238,247,249,.035) 48%,
          rgba(238,247,249,0) 100%
        );

      filter: blur(4px);

      opacity: .55;
    }

    /* =========================================================
       Horizon
       ========================================================= */

    .horizon {
      position: absolute;

      left: -10%;
      right: -10%;
      top: 37.5vh;

      height: 1px;

      z-index: 13;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,.16) 18%,
          rgba(255,255,255,.36) 50%,
          rgba(255,255,255,.16) 82%,
          transparent 100%
        );

      filter: blur(.35px);
    }

    /* =========================================================
       Ocean
       ========================================================= */

    .ocean {
      position: absolute;

      inset: 37.5vh 0 0;

      z-index: 5;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(170,201,215,.08) 0%,
          rgba(158,193,209,.18) 20%,
          rgba(139,184,201,.30) 52%,
          rgba(120,172,192,.44) 100%
        );
    }

    /* =========================================================
       Ocean waves
       ========================================================= */

    .ocean::before {
      content: "";

      position: absolute;

      inset: -8% -15% -5%;

      z-index: 6;

      pointer-events: none;

      background:

        radial-gradient(
          ellipse 90px 4px at 10% 12%,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 130px 4px at 45% 20%,
          rgba(255,255,255,.065) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 110px 4px at 82% 15%,
          rgba(255,255,255,.06) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 150px 5px at 25% 32%,
          rgba(255,255,255,.055) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 120px 4px at 68% 38%,
          rgba(255,255,255,.05) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 170px 5px at 92% 48%,
          rgba(255,255,255,.045) 0%,
          rgba(255,255,255,0) 75%
        );

      background-size:
        420px 150px,
        510px 170px,
        460px 150px,
        560px 190px,
        500px 180px,
        620px 210px;

      background-position:
        0 0,
        0 25px,
        0 70px,
        0 110px,
        0 150px,
        0 200px;

      opacity: .65;

      will-change: transform;

      animation:
        distantWaves 13s ease-in-out infinite;
    }

    .ocean::after {
      content: "";

      position: absolute;

      inset: 5% -18% -8%;

      z-index: 7;

      pointer-events: none;

      background:

        radial-gradient(
          ellipse 180px 7px at 8% 18%,
          rgba(255,255,255,.095) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 230px 7px at 38% 30%,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 200px 7px at 70% 24%,
          rgba(255,255,255,.085) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 260px 8px at 94% 42%,
          rgba(255,255,255,.065) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 210px 7px at 20% 58%,
          rgba(255,255,255,.06) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 280px 8px at 58% 68%,
          rgba(255,255,255,.055) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 230px 7px at 88% 82%,
          rgba(255,255,255,.05) 0%,
          rgba(255,255,255,0) 72%
        );

      background-size:
        520px 190px,
        650px 230px,
        580px 210px,
        700px 250px,
        560px 220px,
        720px 270px,
        620px 250px;

      background-position:
        0 0,
        80px 20px,
        -40px 80px,
        120px 120px,
        -80px 160px,
        60px 220px,
        -100px 280px;

      opacity: .72;

      will-change: transform;

      animation:
        nearWaves 8.5s ease-in-out infinite;
    }

    /* =========================================================
       Waves animation
       ========================================================= */

    @keyframes distantWaves {

      0% {
        transform:
          translate3d(-7%,0,0)
          rotate(-.15deg)
          scaleX(.98)
          scaleY(.96);
      }

      15% {
        transform:
          translate3d(-3%,1%,0)
          rotate(.08deg)
          scaleX(1.015)
          scaleY(1.035);
      }

      30% {
        transform:
          translate3d(2%,-.6%,0)
          rotate(-.08deg)
          scaleX(.985)
          scaleY(.975);
      }

      45% {
        transform:
          translate3d(7%,.8%,0)
          rotate(.16deg)
          scaleX(1.025)
          scaleY(1.05);
      }

      60% {
        transform:
          translate3d(4%,-.8%,0)
          rotate(-.10deg)
          scaleX(.99)
          scaleY(.97);
      }

      75% {
        transform:
          translate3d(-1%,.7%,0)
          rotate(.10deg)
          scaleX(1.02)
          scaleY(1.04);
      }

      90% {
        transform:
          translate3d(-5%,-.4%,0)
          rotate(-.06deg)
          scaleX(.99)
          scaleY(.98);
      }

      100% {
        transform:
          translate3d(-7%,0,0)
          rotate(-.15deg)
          scaleX(.98)
          scaleY(.96);
      }
    }

    @keyframes nearWaves {

      0% {
        transform:
          translate3d(8%,0,0)
          rotate(.18deg)
          scaleX(.96)
          scaleY(.94);
      }

      12% {
        transform:
          translate3d(4%,1.8%,0)
          rotate(-.08deg)
          scaleX(1.02)
          scaleY(1.055);
      }

      25% {
        transform:
          translate3d(-1%,-.7%,0)
          rotate(.14deg)
          scaleX(.975)
          scaleY(.965);
      }

      38% {
        transform:
          translate3d(-7%,1.5%,0)
          rotate(-.18deg)
          scaleX(1.035)
          scaleY(1.075);
      }

      50% {
        transform:
          translate3d(-4%,-.8%,0)
          rotate(.08deg)
          scaleX(.97)
          scaleY(.955);
      }

      63% {
        transform:
          translate3d(2%,1.2%,0)
          rotate(-.13deg)
          scaleX(1.025)
          scaleY(1.065);
      }

      76% {
        transform:
          translate3d(7%,-.6%,0)
          rotate(.17deg)
          scaleX(.98)
          scaleY(.97);
      }

      88% {
        transform:
          translate3d(3%,1%,0)
          rotate(-.08deg)
          scaleX(1.02)
          scaleY(1.045);
      }

      100% {
        transform:
          translate3d(8%,0,0)
          rotate(.18deg)
          scaleX(.96)
          scaleY(.94);
      }
    }

    /* =========================================================
       Water layers
       ========================================================= */

    .water,
    .surface-far,
    .surface-mid,
    .surface-near {
      position: absolute;

      left: -12%;
      width: 124%;

      pointer-events: none;

      will-change: transform;
    }

    .water {
      top: 2%;
      height: 45%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 42% 8% at 18% 30%,
          rgba(255,255,255,.18) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 38% 7% at 70% 48%,
          rgba(255,255,255,.13) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 48% 8% at 42% 74%,
          rgba(255,255,255,.10) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        waterDrift 17s ease-in-out infinite;
    }

    .surface-far {
      top: 7%;
      height: 34%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 34% 10% at 22% 35%,
          rgba(255,255,255,.13) 0%,
          rgba(255,255,255,0) 70%
        ),
        radial-gradient(
          ellipse 30% 8% at 77% 65%,
          rgba(255,255,255,.10) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        surfaceFar 21s ease-in-out infinite;
    }

    .surface-mid {
      top: 20%;
      height: 38%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 46% 9% at 8% 38%,
          rgba(255,255,255,.13) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 40% 8% at 57% 28%,
          rgba(255,255,255,.10) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 44% 9% at 91% 67%,
          rgba(255,255,255,.11) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        surfaceMid 13s ease-in-out infinite;
    }

    .surface-near {
      top: 43%;
      height: 50%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 52% 11% at 24% 36%,
          rgba(255,255,255,.11) 0%,
          rgba(255,255,255,0) 70%
        ),
        radial-gradient(
          ellipse 46% 10% at 72% 58%,
          rgba(255,255,255,.09) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        surfaceNear 16s ease-in-out infinite;
    }

    @keyframes waterDrift {

      0%,
      100% {
        transform:
          translate3d(-3%,0,0)
          scaleY(.98);
      }

      50% {
        transform:
          translate3d(4%,2.5%,0)
          scaleY(1.08);
      }
    }

    @keyframes surfaceFar {

      0%,
      100% {
        transform:
          translate3d(3%,-1%,0)
          scale(.98);
      }

      50% {
        transform:
          translate3d(-5%,1.5%,0)
          scale(1.07);
      }
    }

    @keyframes surfaceMid {

      0%,
      100% {
        transform:
          translate3d(-4%,0,0)
          scaleY(.97);
      }

      25% {
        transform:
          translate3d(0%,1.3%,0)
          scaleY(1.04);
      }

      50% {
        transform:
          translate3d(5%,-1%,0)
          scaleY(1.09);
      }

      75% {
        transform:
          translate3d(1%,1%,0)
          scaleY(1.03);
      }
    }

    @keyframes surfaceNear {

      0%,
      100% {
        transform:
          translate3d(4%,0,0)
          scale(.97);
      }

      25% {
        transform:
          translate3d(0%,2%,0)
          scale(1.035);
      }

      50% {
        transform:
          translate3d(-5%,-1%,0)
          scale(1.08);
      }

      75% {
        transform:
          translate3d(-1%,1.5%,0)
          scale(1.03);
      }
    }

    /* =========================================================
       Water gaps
       ========================================================= */

    .water-gaps {
      position: absolute;
      inset: 0;

      z-index: 8;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse 22% 4% at 18% 18%,
          rgba(255,255,255,.08),
          transparent 72%
        ),
        radial-gradient(
          ellipse 28% 5% at 76% 30%,
          rgba(255,255,255,.07),
          transparent 72%
        ),
        radial-gradient(
          ellipse 20% 4% at 42% 55%,
          rgba(255,255,255,.06),
          transparent 72%
        ),
        radial-gradient(
          ellipse 34% 6% at 83% 76%,
          rgba(255,255,255,.05),
          transparent 72%
        );

      animation:
        gapsDrift 14s ease-in-out infinite;
    }

    @keyframes gapsDrift {

      0%,
      100% {
        transform:
          translate3d(0,0,0)
          scaleY(.98);
      }

      25% {
        transform:
          translate3d(-2%,.8%,0)
          scaleY(1.04);
      }

      50% {
        transform:
          translate3d(-4%,-.4%,0)
          scaleY(.97);
      }

      75% {
        transform:
          translate3d(-1%,.7%,0)
          scaleY(1.05);
      }
    }

    /* =========================================================
       Island shadow
       ========================================================= */

    .island-shadow {
      position: absolute;

      left: 50%;
      top: calc(37.5vh + 3px);

      width: clamp(108px, 19.5vw, 195px);
      height: clamp(48px, 8.7vw, 87px);

      transform: translateX(-50%);

      z-index: 11;

      pointer-events: none;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 50% 8%,
          rgba(65,102,108,.11) 0%,
          rgba(73,110,116,.075) 30%,
          rgba(88,122,127,.04) 55%,
          rgba(109,140,144,0) 82%
        );

      filter: blur(5px);

      opacity: .72;

      animation:
        islandShadow 9s ease-in-out infinite;
    }

    @keyframes islandShadow {

      0%,
      100% {
        transform:
          translateX(-50%)
          scaleX(.94)
          scaleY(.92);

        opacity: .56;
      }

      20% {
        transform:
          translateX(-50%)
          scaleX(1.08)
          scaleY(1.02);

        opacity: .72;
      }

      43% {
        transform:
          translateX(-50%)
          scaleX(.97)
          scaleY(1.08);

        opacity: .61;
      }

      68% {
        transform:
          translateX(-50%)
          scaleX(1.10)
          scaleY(.95);

        opacity: .68;
      }

      100% {
        transform:
          translateX(-50%)
          scaleX(.94)
          scaleY(.92);

        opacity: .56;
      }
    }

    /* =========================================================
       Ocean mist
       ========================================================= */

    .ocean-mist {
      position: absolute;

      inset: 36vh 0 auto;

      height: 12vh;

      z-index: 12;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(239,246,248,.18),
          rgba(239,246,248,0)
        );

      filter: blur(7px);

      opacity: .48;
    }

    /* =========================================================
       Brand
       ========================================================= */

    .brand {
      position: absolute;

      left: 50%;
      bottom: 8.5vh;

      z-index: 20;

      transform: translateX(-50%);

      text-align: center;

      white-space: nowrap;

      user-select: none;
    }

    .brand-name {
      margin: 0;

      font-size: clamp(15px, 1.25vw, 19px);
      font-weight: 400;

      letter-spacing: .24em;
      text-indent: .24em;

      color: rgba(35,57,66,.48);
    }

    .brand-status {
      margin-top: 9px;

      font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        monospace;

      font-size: 7px;
      line-height: 1;

      letter-spacing: .20em;
      text-indent: .20em;

      color: rgba(35,57,66,.27);

      text-transform: uppercase;
    }

    .status-dot {
      display: inline-block;

      width: 3px;
      height: 3px;

      margin-right: 6px;

      border-radius: 50%;

      background: rgba(35,57,66,.25);

      vertical-align: 1px;

      animation:
        statusPulse 3.2s ease-in-out infinite;
    }

    @keyframes statusPulse {

      0%,
      100% {
        opacity: .25;
      }

      50% {
        opacity: .65;
      }
    }

    /* =========================================================
       Mobile
       ========================================================= */

    @media (max-width: 600px) {

      .scene {
        min-height: 500px;
      }

      /*
       * 円は画面幅に応じて変化。
       * 見える窓は円の高さの20%。
       */
      .island-window {
        top: calc(37.5vh - clamp(20px, 3.6vw, 36px));

        width: clamp(100px, 18vw, 180px);
        height: clamp(20px, 3.6vw, 36px);
      }

      .island {
        width: clamp(100px, 18vw, 180px);
        height: clamp(100px, 18vw, 180px);
      }

      .island-shadow {
        top: calc(37.5vh + 3px);

        width: clamp(108px, 19.5vw, 195px);
        height: clamp(48px, 8.7vw, 87px);
      }

      .island-gap-mist {
        width: clamp(124px, 23vw, 230px);
      }

      .brand {
        bottom: 8vh;
      }

      .brand-name {
        font-size: 15px;
      }

      .brand-status {
        font-size: 7px;
      }
    }

    /* =========================================================
       Reduced motion
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <div class="atmosphere"></div>

    <!-- =======================================================
         巨大な円。
         円のサイズは画面幅に応じて変化し、
         上側20%だけを表示する。
         ======================================================= -->

    <div class="island-window">
      <div class="island"></div>
    </div>

    <!-- 島と水平線の間の薄い霧 -->
    <div class="island-gap-mist"></div>

    <!-- 海面にゆらぐ島影 -->
    <div class="island-shadow"></div>

    <!-- 水平線 -->
    <div class="horizon"></div>

    <!-- 海 -->
    <div class="ocean">

      <div class="water"></div>

      <div class="surface-far"></div>

      <div class="surface-mid"></div>

      <div class="surface-near"></div>

      <div class="water-gaps"></div>

    </div>

    <!-- 水平線付近の大気 -->
    <div class="ocean-mist"></div>

    <!-- Brand -->
    <div class="brand">

      <h1 class="brand-name">
        esenus
      </h1>
