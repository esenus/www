<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>esenus</title>
  <meta name="description" content="esenus">

  <style>
    /* =========================================================
       Base
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #e7f0f4;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    /* =========================================================
       Scene
       ========================================================= */

    .scene {
      position: relative;

      width: 100%;
      height: 100svh;
      min-height: 520px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #eaf2f5 0%,
          #e5eef2 27%,
          #e0ebef 48%,
          #dce9ee 100%
        );
    }

    /* =========================================================
       Atmosphere
       ========================================================= */

    .atmosphere {
      position: absolute;
      inset: 0;

      z-index: 1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 38%,
          rgba(255,255,255,0.56) 0%,
          rgba(255,255,255,0.26) 27%,
          rgba(255,255,255,0) 65%
        );

      animation:
        atmosphereBreath 12s ease-in-out infinite;
    }

    @keyframes atmosphereBreath {
      0%,
      100% {
        opacity: 0.72;
        transform: scale(1);
      }

      50% {
        opacity: 0.92;
        transform: scale(1.025);
      }
    }

    /* =========================================================
       Horizon
       ========================================================= */

    .horizon {
      position: absolute;

      left: -10%;
      right: -10%;
      top: 37.5vh;

      height: 1px;

      z-index: 4;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,0.16) 18%,
          rgba(255,255,255,0.36) 50%,
          rgba(255,255,255,0.16) 82%,
          transparent 100%
        );

      filter: blur(0.35px);
    }

    /* =========================================================
       Mirage island
       ========================================================= */

    .island {
      position: absolute;

      left: 50%;
      top: 34.0vh;

      width: min(25vw, 280px);
      height: clamp(30px, 4vw, 40px);

      transform:
        translateX(-50%)
        scaleX(1);

      z-index: 3;
      pointer-events: none;

      border-radius:
        50%
        50%
        44%
        44% / 78%
        78%
        38%
        38%;

      background:
        radial-gradient(
          ellipse 92% 78% at 50% 62%,
          rgba(66,104,110,0.18) 0%,
          rgba(70,108,114,0.13) 28%,
          rgba(83,120,125,0.075) 52%,
          rgba(105,137,141,0.035) 70%,
          rgba(255,255,255,0) 100%
        );

      filter:
        blur(3px)
        saturate(0.72);

      opacity: 0.62;

      animation:
        mirageIsland 18s ease-in-out infinite;
    }

    .island::before {
      content: "";

      position: absolute;

      left: 6%;
      right: 6%;
      top: 4%;

      height: 62%;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 50% 70%,
          rgba(54,94,101,0.13) 0%,
          rgba(66,105,111,0.075) 42%,
          rgba(93,128,132,0.025) 70%,
          transparent 100%
        );

      filter: blur(3px);

      opacity: 0.72;
    }

    .island::after {
      content: "";

      position: absolute;

      left: -10%;
      right: -10%;

      /* 島と下側の影・霧の間隔を3px広げる */
      bottom: -8px;

      height: 34%;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 50% 35%,
          rgba(237,246,248,0.12) 0%,
          rgba(237,246,248,0.045) 45%,
          rgba(237,246,248,0) 80%
        );

      filter: blur(5px);

      opacity: 0.78;
    }

    @keyframes mirageIsland {

      0%,
      100% {
        transform:
          translateX(-50%)
          scaleX(0.97)
          scaleY(0.96);

        opacity: 0.50;
      }

      22% {
        transform:
          translateX(-50%)
          scaleX(1.015)
          scaleY(1.015);

        opacity: 0.61;
      }

      47% {
        transform:
          translateX(-50%)
          scaleX(0.985)
          scaleY(0.98);

        opacity: 0.55;
      }

      71% {
        transform:
          translateX(-50%)
          scaleX(1.025)
          scaleY(1.025);

        opacity: 0.64;
      }

      100% {
        transform:
          translateX(-50%)
          scaleX(0.97)
          scaleY(0.96);

        opacity: 0.50;
      }
    }

    /* =========================================================
       Island atmosphere
       ========================================================= */

    .island-mist {
      position: absolute;

      left: 50%;
      top: 32.8vh;

      width: min(34vw, 370px);
      height: clamp(48px, 6vw, 64px);

      transform: translateX(-50%);

      z-index: 3;
      pointer-events: none;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse 48% 42% at 50% 48%,
          rgba(240,247,249,0.085) 0%,
          rgba(240,247,249,0.045) 34%,
          rgba(240,247,249,0.018) 58%,
          rgba(240,247,249,0) 82%
        );

      filter: blur(8px);

      opacity: 0.34;

      animation:
        islandMist 17s ease-in-out infinite;
    }

    @keyframes islandMist {

      0%,
      100% {
        transform:
          translateX(-50%)
          scaleX(0.96)
          scaleY(0.94);

        opacity: 0.28;
      }

      30% {
        transform:
          translateX(-50%)
          scaleX(1.025)
          scaleY(1.02);

        opacity: 0.37;
      }

      60% {
        transform:
          translateX(-50%)
          scaleX(0.985)
          scaleY(1.04);

        opacity: 0.30;
      }

      100% {
        transform:
          translateX(-50%)
          scaleX(0.96)
          scaleY(0.94);

        opacity: 0.28;
      }
    }

    /* =========================================================
       Ocean
       ========================================================= */

    .ocean {
      position: absolute;
      inset: 37.5vh 0 0;

      z-index: 5;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(170,201,215,0.08) 0%,
          rgba(158,193,209,0.18) 20%,
          rgba(139,184,201,0.30) 52%,
          rgba(120,172,192,0.44) 100%
        );
    }

    /* =========================================================
       Wave layers
       ========================================================= */

    .ocean::before {
      content: "";

      position: absolute;
      inset: -8% -15% -5%;

      z-index: 6;
      pointer-events: none;

      background:

        radial-gradient(
          ellipse 90px 4px at 10% 12%,
          rgba(255,255,255,0.075) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 130px 4px at 45% 20%,
          rgba(255,255,255,0.065) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 110px 4px at 82% 15%,
          rgba(255,255,255,0.06) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 150px 5px at 25% 32%,
          rgba(255,255,255,0.055) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 120px 4px at 68% 38%,
          rgba(255,255,255,0.05) 0%,
          rgba(255,255,255,0) 75%
        ),

        radial-gradient(
          ellipse 170px 5px at 92% 48%,
          rgba(255,255,255,0.045) 0%,
          rgba(255,255,255,0) 75%
        );

      background-size:
        420px 150px,
        510px 170px,
        460px 150px,
        560px 190px,
        500px 180px,
        620px 210px;

      background-position:
        0 0,
        0 25px,
        0 70px,
        0 110px,
        0 150px,
        0 200px;

      opacity: 0.65;

      will-change: transform;

      animation:
        distantWaves 13s ease-in-out infinite;
    }

    .ocean::after {
      content: "";

      position: absolute;
      inset: 5% -18% -8%;

      z-index: 7;
      pointer-events: none;

      background:

        radial-gradient(
          ellipse 180px 7px at 8% 18%,
          rgba(255,255,255,0.095) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 230px 7px at 38% 30%,
          rgba(255,255,255,0.075) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 200px 7px at 70% 24%,
          rgba(255,255,255,0.085) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 260px 8px at 94% 42%,
          rgba(255,255,255,0.065) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 210px 7px at 20% 58%,
          rgba(255,255,255,0.06) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 280px 8px at 58% 68%,
          rgba(255,255,255,0.055) 0%,
          rgba(255,255,255,0) 72%
        ),

        radial-gradient(
          ellipse 230px 7px at 88% 82%,
          rgba(255,255,255,0.05) 0%,
          rgba(255,255,255,0) 72%
        );

      background-size:
        520px 190px,
        650px 230px,
        580px 210px,
        700px 250px,
        560px 220px,
        720px 270px,
        620px 250px;

      background-position:
        0 0,
        80px 20px,
        -40px 80px,
        120px 120px,
        -80px 160px,
        60px 220px,
        -100px 280px;

      opacity: 0.72;

      will-change: transform;

      animation:
        nearWaves 8.5s ease-in-out infinite;
    }

    /* =========================================================
       Wave movement
       ========================================================= */

    @keyframes distantWaves {

      0% {
        transform:
          translate3d(-7%, 0%, 0)
          rotate(-0.15deg)
          scaleX(0.98)
          scaleY(0.96);
      }

      15% {
        transform:
          translate3d(-3%, 1.0%, 0)
          rotate(0.08deg)
          scaleX(1.015)
          scaleY(1.035);
      }

      30% {
        transform:
          translate3d(2%, -0.6%, 0)
          rotate(-0.08deg)
          scaleX(0.985)
          scaleY(0.975);
      }

      45% {
        transform:
          translate3d(7%, 0.8%, 0)
          rotate(0.16deg)
          scaleX(1.025)
          scaleY(1.05);
      }

      60% {
        transform:
          translate3d(4%, -0.8%, 0)
          rotate(-0.10deg)
          scaleX(0.99)
          scaleY(0.97);
      }

      75% {
        transform:
          translate3d(-1%, 0.7%, 0)
          rotate(0.10deg)
          scaleX(1.02)
          scaleY(1.04);
      }

      90% {
        transform:
          translate3d(-5%, -0.4%, 0)
          rotate(-0.06deg)
          scaleX(0.99)
          scaleY(0.98);
      }

      100% {
        transform:
          translate3d(-7%, 0%, 0)
          rotate(-0.15deg)
          scaleX(0.98)
          scaleY(0.96);
      }
    }

    @keyframes nearWaves {

      0% {
        transform:
          translate3d(8%, 0%, 0)
          rotate(0.18deg)
          scaleX(0.96)
          scaleY(0.94);
      }

      12% {
        transform:
          translate3d(4%, 1.8%, 0)
          rotate(-0.08deg)
          scaleX(1.02)
          scaleY(1.055);
      }

      25% {
        transform:
          translate3d(-1%, -0.7%, 0)
          rotate(0.14deg)
          scaleX(0.975)
          scaleY(0.965);
      }

      38% {
        transform:
          translate3d(-7%, 1.5%, 0)
          rotate(-0.18deg)
          scaleX(1.035)
          scaleY(1.075);
      }

      50% {
        transform:
          translate3d(-4%, -0.8%, 0)
          rotate(0.08deg)
          scaleX(0.97)
          scaleY(0.955);
      }

      63% {
        transform:
          translate3d(2%, 1.2%, 0)
          rotate(-0.13deg)
          scaleX(1.025)
          scaleY(1.065);
      }

      76% {
        transform:
          translate3d(7%, -0.6%, 0)
          rotate(0.17deg)
          scaleX(0.98)
          scaleY(0.97);
      }

      88% {
        transform:
          translate3d(3%, 1.0%, 0)
          rotate(-0.08deg)
          scaleX(1.02)
          scaleY(1.045);
      }

      100% {
        transform:
          translate3d(8%, 0%, 0)
          rotate(0.18deg)
          scaleX(0.96)
          scaleY(0.94);
      }
    }

    /* =========================================================
       Existing water layers
       ========================================================= */

    .water,
    .surface-far,
    .surface-mid,
    .surface-near {
      position: absolute;

      left: -12%;
      width: 124%;

      pointer-events: none;
      will-change: transform;
    }

    .water {
      top: 2%;
      height: 45%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 42% 8% at 18% 30%,
          rgba(255,255,255,0.18) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 38% 7% at 70% 48%,
          rgba(255,255,255,0.13) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 48% 8% at 42% 74%,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        waterDrift 17s ease-in-out infinite;
    }

    .surface-far {
      top: 7%;
      height: 34%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 34% 10% at 22% 35%,
          rgba(255,255,255,0.13) 0%,
          rgba(255,255,255,0) 70%
        ),
        radial-gradient(
          ellipse 30% 8% at 77% 65%,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        surfaceFar 21s ease-in-out infinite;
    }

    .surface-mid {
      top: 20%;
      height: 38%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 46% 9% at 8% 38%,
          rgba(255,255,255,0.13) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 40% 8% at 57% 28%,
          rgba(255,255,255,0.10) 0%,
          rgba(255,255,255,0) 72%
        ),
        radial-gradient(
          ellipse 44% 9% at 91% 67%,
          rgba(255,255,255,0.11) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        surfaceMid 13s ease-in-out infinite;
    }

    .surface-near {
      top: 43%;
      height: 50%;

      z-index: 5;

      background:
        radial-gradient(
          ellipse 52% 11% at 24% 36%,
          rgba(255,255,255,0.11) 0%,
          rgba(255,255,255,0) 70%
        ),
        radial-gradient(
          ellipse 46% 10% at 72% 58%,
          rgba(255,255,255,0.09) 0%,
          rgba(255,255,255,0) 72%
        );

      animation:
        surfaceNear 16s ease-in-out infinite;
    }

    /* =========================================================
       Existing water motion
       ========================================================= */

    @keyframes waterDrift {
      0%,
      100% {
        transform:
          translate3d(-3%, 0, 0)
          scaleY(0.98);
      }

      50% {
        transform:
          translate3d(4%, 2.5%, 0)
          scaleY(1.08);
      }
    }

    @keyframes surfaceFar {
      0%,
      100% {
        transform:
          translate3d(3%, -1%, 0)
          scale(0.98);
      }

      50% {
        transform:
          translate3d(-5%, 1.5%, 0)
          scale(1.07);
      }
    }

    @keyframes surfaceMid {
      0%,
      100% {
        transform:
          translate3d(-4%, 0, 0)
          scaleY(0.97);
      }

      25% {
        transform:
          translate3d(0%, 1.3%, 0)
          scaleY(1.04);
      }

      50% {
        transform:
          translate3d(5%, -1%, 0)
          scaleY(1.09);
      }

      75% {
        transform:
          translate3d(1%, 1%, 0)
          scaleY(1.03);
      }
    }

    @keyframes surfaceNear {
      0%,
      100% {
        transform:
          translate3d(4%, 0, 0)
          scale(0.97);
      }

      25% {
        transform:
          translate3d(0%, 2%, 0)
          scale(1.035);
      }

      50% {
        transform:
          translate3d(-5%, -1%, 0)
          scale(1.08);
      }

      75% {
        transform:
          translate3d(-1%, 1.5%, 0)
          scale(1.03);
      }
    }

    /* =========================================================
       Water gaps
       ========================================================= */

    .water-gaps {
      position: absolute;
      inset: 0;

      z-index: 8;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse 22% 4% at 18% 18%,
          rgba(255,255,255,0.08),
          transparent 72%
        ),
        radial-gradient(
          ellipse 28% 5% at 76% 30%,
          rgba(255,255,255,0.07),
          transparent 72%
        ),
        radial-gradient(
          ellipse 20% 4% at 42% 55%,
          rgba(255,255,255,0.06),
          transparent 72%
        ),
        radial-gradient(
          ellipse 34% 6% at 83% 76%,
          rgba(255,255,255,0.05),
          transparent 72%
        );

      animation:
        gapsDrift 14s ease-in-out infinite;
    }

    @keyframes gapsDrift {
      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          scaleY(0.98);
      }

      25% {
        transform:
          translate3d(-2%, 0.8%, 0)
          scaleY(1.04);
      }

      50% {
        transform:
          translate3d(-4%, -0.4%, 0)
          scaleY(0.97);
      }

      75% {
        transform:
          translate3d(-1%, 0.7%, 0)
          scaleY(1.05);
      }
    }

    /* =========================================================
       Ocean mist
       ========================================================= */

    .ocean-mist {
      position: absolute;

      inset: 36vh 0 auto;
      height: 12vh;

      z-index: 12;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(239,246,248,0.18),
          rgba(239,246,248,0)
        );

      filter: blur(7px);
      opacity: 0.48;
    }

    /* =========================================================
       Brand
       ========================================================= */

    .brand {
      position: absolute;

      left: 50%;
      bottom: 8.5vh;

      z-index: 20;

      transform: translateX(-50%);

      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    .brand-name {
      margin: 0;

      font-size: clamp(15px, 1.25vw, 19px);
      font-weight: 400;

      letter-spacing: 0.24em;
      text-indent: 0.24em;

      color: rgba(35,57,66,0.48);
    }

    .brand-status {
      margin-top: 9px;

      font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        monospace;

      font-size: 7px;
      line-height: 1;

      letter-spacing: 0.20em;
      text-indent: 0.20em;

      color: rgba(35,57,66,0.27);

      text-transform: uppercase;
    }

    .status-dot {
      display: inline-block;

      width: 3px;
      height: 3px;

      margin-right: 6px;

      border-radius: 50%;

      background: rgba(35,57,66,0.25);

      vertical-align: 1px;

      animation:
        statusPulse 3.2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.65;
      }
    }

    /* =========================================================
       Mobile
       ========================================================= */

    @media (max-width: 600px) {

      .scene {
        min-height: 500px;
      }

      .island {
        top: 33.2vh;
        width: 29vw;
        height: 27px;
      }

      .island-mist {
        top: 32.3vh;
        width: 38vw;
        height: 48px;
      }

      .brand {
        bottom: 8vh;
      }

      .brand-name {
        font-size: 15px;
      }

      .brand-status {
        font-size: 7px;
      }
    }

    /* =========================================================
       Reduced motion
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <div class="atmosphere"></div>

    <!-- 水平線の向こうにある蜃気楼 -->
    <div class="island-mist"></div>
    <div class="island"></div>

    <div class="horizon"></div>

    <div class="ocean">
      <div class="water"></div>
      <div class="surface-far"></div>
      <div class="surface-mid"></div>
      <div class="surface-near"></div>
      <div class="water-gaps"></div>
    </div>

    <div class="ocean-mist"></div>

    <div class="brand">
      <h1 class="brand-name">esenus</h1>

      <div class="brand-status">
        <span class="status-dot"></span>
        awaiting initialization
      </div>
    </div>

  </main>

</body>
</html>
