<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>esenus</title>

<style>
:root {
    /* =====================================================
       Common Geometry
    ===================================================== */

    --island-size: clamp(100px, 18vw, 180px);

    /* 島の上側20%だけを表示 */
    --island-window-height:
        calc(var(--island-size) * 0.20);

    /* 島と水平線の実寸上の隙間 */
    --island-horizon-gap: 4px;

    /* 島影を水平線のすぐ下へ */
    --reflection-offset: 1px;
}


/* =========================================================
   Base
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
}


/* =========================================================
   Scene
========================================================= */

.scene {
    position: relative;

    width: 100%;
    height: 100svh;
    min-height: 520px;

    overflow: hidden;

    background: #05070a;
}


/* =========================================================
   Theme Toggle
========================================================= */

.theme-toggle {
    position: fixed;

    top: 18px;
    right: 18px;

    z-index: 100;

    display: inline-flex;
    align-items: center;
    gap: 7px;

    min-width: 62px;
    height: 26px;

    padding: 0 9px;

    border: 1px solid rgba(220, 230, 235, .12);
    border-radius: 999px;

    background: rgba(5, 7, 10, .28);

    color: rgba(220, 230, 235, .52);

    font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        monospace;

    font-size: 7px;
    line-height: 1;

    letter-spacing: .12em;

    cursor: pointer;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    transition:
        background .35s ease,
        border-color .35s ease,
        color .35s ease,
        opacity .35s ease;
}

.theme-toggle:hover {
    border-color: rgba(220, 230, 235, .22);
}

.theme-toggle:focus-visible {
    outline: 1px solid rgba(220, 230, 235, .4);
    outline-offset: 3px;
}

.theme-toggle-icon {
    display: inline-flex;

    width: 8px;
    height: 8px;

    align-items: center;
    justify-content: center;

    font-size: 9px;
    line-height: 1;
}

.theme-toggle-label {
    display: inline-block;
}


/* =========================================================
   DARK THEME
========================================================= */

.scene[data-theme="dark"] {

    background:
        linear-gradient(
            to bottom,
            #05070a 0%,
            #0b1016 23%,
            #101820 42%,
            #101920 42%,
            #0b1218 70%,
            #05090d 100%
        );
}


/* =========================================================
   DARK — Atmosphere
========================================================= */

.scene[data-theme="dark"] .atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 2;

    background:
        radial-gradient(
            ellipse at 50% 36%,
            rgba(150, 175, 190, 0.05) 0%,
            rgba(100, 125, 140, 0.025) 30%,
            transparent 65%
        );
}

.scene[data-theme="dark"] .atmosphere::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 11% 18%,
            rgba(220, 230, 235, 0.38) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 19% 31%,
            rgba(220, 230, 235, 0.22) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 27% 13%,
            rgba(220, 230, 235, 0.28) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 34% 25%,
            rgba(220, 230, 235, 0.18) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 42% 9%,
            rgba(220, 230, 235, 0.30) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 51% 20%,
            rgba(220, 230, 235, 0.20) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 59% 12%,
            rgba(220, 230, 235, 0.30) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 67% 27%,
            rgba(220, 230, 235, 0.20) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 74% 15%,
            rgba(220, 230, 235, 0.32) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 82% 24%,
            rgba(220, 230, 235, 0.20) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 91% 11%,
            rgba(220, 230, 235, 0.28) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 87% 34%,
            rgba(220, 230, 235, 0.16) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 7% 37%,
            rgba(220, 230, 235, 0.18) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 31% 36%,
            rgba(220, 230, 235, 0.15) 0 0.6px,
            transparent 1.2px
        );

    opacity: .72;

    animation:
        starLight 11s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .atmosphere::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 30%;
    height: 20%;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(190, 210, 220, 0.055) 0%,
            rgba(150, 175, 190, 0.025) 38%,
            transparent 75%
        );

    filter: blur(14px);

    animation:
        skyLight 17s ease-in-out infinite alternate;
}


/* =========================================================
   LIGHT THEME
========================================================= */

.scene[data-theme="light"] {

    background:
        linear-gradient(
            180deg,
            #eaf2f5 0%,
            #e5eef2 27%,
            #e0ebef 48%,
            #dce9ee 100%
        );
}


/* =========================================================
   LIGHT — Atmosphere
========================================================= */

.scene[data-theme="light"] .atmosphere {
    position: absolute;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 38%,
            rgba(255,255,255,.56) 0%,
            rgba(255,255,255,.26) 27%,
            rgba(255,255,255,0) 65%
        );

    animation:
        atmosphereBreath 12s ease-in-out infinite;
}


/* =========================================================
   Island Window
========================================================= */

.island-window {
    position: absolute;

    left: 50%;

    top:
        calc(
            37.5vh
            - var(--island-window-height)
            - var(--island-horizon-gap)
        );

    width: var(--island-size);
    height: var(--island-window-height);

    transform: translateX(-50%);

    overflow: hidden;

    pointer-events: none;

    z-index: 30;
}


/* =========================================================
   DARK — Island
========================================================= */

.scene[data-theme="dark"] .island {

    position: absolute;

    left: 0;
    top: 0;

    width: var(--island-size);
    height: var(--island-size);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(105,119,126,.30) 0%,
            rgba(76,88,95,.27) 28%,
            rgba(43,52,58,.24) 57%,
            rgba(18,24,28,.16) 76%,
            rgba(10,14,17,0) 100%
        );

    filter: blur(1.8px);

    transform-origin: center center;

    animation:
        islandDriftDark 9s ease-in-out infinite alternate;
}


/* =========================================================
   LIGHT — Island

   Darkと同程度、またはそれ以下の存在感。
   グレーではなく、薄い青緑。
========================================================= */

.scene[data-theme="light"] .island {

    position: absolute;

    left: 0;
    top: 0;

    width: var(--island-size);
    height: var(--island-size);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 48% 30%,
            rgba(67,112,114,.18) 0%,
            rgba(59,103,106,.14) 23%,
            rgba(52,94,98,.095) 45%,
            rgba(55,94,98,.052) 66%,
            rgba(55,94,98,0) 82%
        ),
        radial-gradient(
            ellipse at 50% 65%,
            rgba(48,88,92,.085) 0%,
            rgba(48,88,92,.038) 44%,
            rgba(48,88,92,0) 75%
        );

    filter:
        blur(.9px)
        saturate(.78);

    opacity: .72;

    transform-origin: center center;

    animation:
        islandDriftLight 14s ease-in-out infinite;
}


/* =========================================================
   LIGHT — Island Upper Haze
========================================================= */

.scene[data-theme="light"] .island::before {

    content: "";

    position: absolute;

    left: 3%;
    right: 3%;
    top: 1%;

    height: 42%;

    border-radius:
        50%
        50%
        35%
        35% /
        90%
        90%
        35%
        35%;

    background:
        radial-gradient(
            ellipse at 50% 100%,
            rgba(48,90,94,.055) 0%,
            rgba(57,99,103,.038) 42%,
            rgba(77,114,118,.015) 68%,
            rgba(105,137,141,0) 100%
        );

    filter: blur(1px);

    opacity: .72;
}


/* =========================================================
   LIGHT — Island Lower Haze
========================================================= */

.scene[data-theme="light"] .island::after {

    content: "";

    position: absolute;

    left: -8%;
    right: -8%;
    bottom: 8px;

    height: 34%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(237,246,248,.07) 0%,
            rgba(237,246,248,.025) 42%,
            rgba(237,246,248,0) 82%
        );

    filter: blur(5px);

    opacity: .62;
}


/* =========================================================
   Gap Between Island and Horizon
========================================================= */

.island-gap-mist {
    position: absolute;

    left: 50%;

    top:
        calc(
            37.5vh
            - var(--island-horizon-gap)
        );

    transform: translateX(-50%);

    pointer-events: none;

    border-radius: 50%;
}


/* =========================================================
   DARK — Gap Mist
========================================================= */

.scene[data-theme="dark"] .island-gap-mist {

    width: clamp(124px,23vw,230px);
    height: 8px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(190,205,210,.09) 0%,
            rgba(165,185,195,.045) 38%,
            transparent 75%
        );

    filter: blur(4px);

    z-index: 32;

    animation:
        gapMistDark 9s ease-in-out infinite alternate;
}


/* =========================================================
   LIGHT — Gap Mist

   実際の隙間は4px。
   視覚的に隙間が広く見えないよう、
   霧はかなり弱くする。
========================================================= */

.scene[data-theme="light"] .island-gap-mist {

    width: clamp(110px,20vw,200px);
    height: 6px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(238,247,249,.18) 0%,
            rgba(238,247,249,.055) 48%,
            rgba(238,247,249,0) 100%
        );

    filter: blur(3px);

    opacity: .42;

    z-index: 9;
}


/* =========================================================
   Horizon
========================================================= */

.horizon {
    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;

    height: 1px;

    pointer-events: none;
}


/* =========================================================
   DARK — Horizon
========================================================= */

.scene[data-theme="dark"] .horizon {

    background:
        linear-gradient(
            to right,
            transparent 0%,
            rgba(185,200,210,.06) 18%,
            rgba(205,215,220,.11) 50%,
            rgba(185,200,210,.06) 82%,
            transparent 100%
        );

    filter: blur(.25px);

    z-index: 34;
}


/* =========================================================
   LIGHT — Horizon
========================================================= */

.scene[data-theme="light"] .horizon {

    left: -10%;
    right: -10%;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,.16) 18%,
            rgba(255,255,255,.36) 50%,
            rgba(255,255,255,.16) 82%,
            transparent 100%
        );

    filter: blur(.35px);

    z-index: 13;
}


/* =========================================================
   Ocean
========================================================= */

.ocean {
    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;
    bottom: 0;

    overflow: hidden;

    z-index: 5;
}


/* =========================================================
   DARK — Ocean
========================================================= */

.scene[data-theme="dark"] .ocean {

    background:
        linear-gradient(
            to bottom,
            rgba(25,35,42,.20) 0%,
            rgba(13,21,27,.32) 25%,
            rgba(8,14,19,.65) 70%,
            rgba(3,7,10,.95) 100%
        );
}


/* =========================================================
   LIGHT — Ocean
========================================================= */

.scene[data-theme="light"] .ocean {

    background:
        linear-gradient(
            180deg,
            rgba(170,201,215,.08) 0%,
            rgba(158,193,209,.18) 20%,
            rgba(139,184,201,.30) 52%,
            rgba(120,172,192,.44) 100%
        );
}


/* =========================================================
   Ocean Far Wave
========================================================= */

.scene[data-theme="dark"] .ocean::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 8%;

    width: 360px;
    height: 52px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.94);

    border-top: 1px solid rgba(180,200,210,.09);

    border-radius: 50%;

    filter: blur(1px);

    will-change: transform;

    animation:
        oceanWaveFar 8s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .ocean::before {

    content: "";

    position: absolute;

    inset: -8% -15% -5%;

    z-index: 6;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse 90px 4px at 10% 12%,
            rgba(255,255,255,.075) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 130px 4px at 45% 20%,
            rgba(255,255,255,.065) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 110px 4px at 82% 15%,
            rgba(255,255,255,.06) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 150px 5px at 25% 32%,
            rgba(255,255,255,.055) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 120px 4px at 68% 38%,
            rgba(255,255,255,.05) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 170px 5px at 92% 48%,
            rgba(255,255,255,.045) 0%,
            rgba(255,255,255,0) 75%
        );

    background-size:
        420px 150px,
        510px 170px,
        460px 150px,
        560px 190px,
        500px 180px,
        620px 210px;

    background-position:
        0 0,
        0 25px,
        0 70px,
        0 110px,
        0 150px,
        0 200px;

    opacity: .65;

    will-change: transform;

    animation:
        distantWaves 13s ease-in-out infinite;
}


/* =========================================================
   Ocean Middle / Near
========================================================= */

.scene[data-theme="dark"] .ocean::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 17%;

    width: 520px;
    height: 72px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(1);

    border-top: 1px solid rgba(170,190,200,.075);

    border-radius: 50%;

    filter: blur(1.2px);

    will-change: transform;

    animation:
        oceanWaveMid 10s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .ocean::after {

    content: "";

    position: absolute;

    inset: 5% -18% -8%;

    z-index: 7;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse 180px 7px at 8% 18%,
            rgba(255,255,255,.095) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 230px 7px at 38% 30%,
            rgba(255,255,255,.075) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 200px 7px at 70% 24%,
            rgba(255,255,255,.085) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 260px 8px at 94% 42%,
            rgba(255,255,255,.065) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 210px 7px at 20% 58%,
            rgba(255,255,255,.06) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 280px 8px at 58% 68%,
            rgba(255,255,255,.055) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 230px 7px at 88% 82%,
            rgba(255,255,255,.05) 0%,
            rgba(255,255,255,0) 72%
        );

    background-size:
        520px 190px,
        650px 230px,
        580px 210px,
        700px 250px,
        560px 220px,
        720px 270px,
        620px 250px;

    background-position:
        0 0,
        80px 20px,
        -40px 80px,
        120px 120px,
        -80px 160px,
        60px 220px,
        -100px 280px;

    opacity: .72;

    will-change: transform;

    animation:
        nearWaves 8.5s ease-in-out infinite;
}


/* =========================================================
   Water Layers
========================================================= */

.water,
.surface-far,
.surface-mid,
.surface-near {
    position: absolute;

    pointer-events: none;

    will-change: transform;
}


/* =========================================================
   DARK — Water Layers
========================================================= */

.scene[data-theme="dark"] .water {
    left: 50%;
    top: 31%;

    width: 700px;
    height: 90px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.96);

    border-top: 1px solid rgba(170,190,200,.065);

    border-radius: 50%;

    filter: blur(1.5px);

    animation:
        oceanWaveNear 12s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-far {
    left: 50%;
    top: 43%;

    width: 860px;
    height: 100px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.96);

    border-top: 1px solid rgba(165,185,195,.055);

    border-radius: 50%;

    filter: blur(1.5px);

    animation:
        oceanSurfaceFar 14s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-mid {
    left: 50%;
    top: 58%;

    width: 1050px;
    height: 120px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(1);

    border-top: 1px solid rgba(155,175,185,.048);

    border-radius: 50%;

    filter: blur(2px);

    animation:
        oceanSurfaceMid 16s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-near {
    left: 50%;
    top: 75%;

    width: 1300px;
    height: 150px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.95);

    border-top: 1px solid rgba(145,165,175,.04);

    border-radius: 50%;

    filter: blur(2px);

    animation:
        oceanSurfaceNear 18s ease-in-out infinite alternate;
}


/* =========================================================
   LIGHT — Water
========================================================= */

.scene[data-theme="light"] .water,
.scene[data-theme="light"] .surface-far,
.scene[data-theme="light"] .surface-mid,
.scene[data-theme="light"] .surface-near {

    left: -12%;
    width: 124%;
}


/* ---------------------------------------------------------
   Light Water
--------------------------------------------------------- */

.scene[data-theme="light"] .water {

    top: 2%;
    height: 45%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 42% 8% at 18% 30%,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 38% 7% at 70% 48%,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 48% 8% at 42% 74%,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        waterDrift 17s ease-in-out infinite;
}


/* ---------------------------------------------------------
   Light Surface Far
--------------------------------------------------------- */

.scene[data-theme="light"] .surface-far {

    top: 7%;
    height: 34%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 34% 10% at 22% 35%,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,0) 70%
        ),
        radial-gradient(
            ellipse 30% 8% at 77% 65%,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        surfaceFar 21s ease-in-out infinite;
}


/* ---------------------------------------------------------
   Light Surface Mid
--------------------------------------------------------- */

.scene[data-theme="light"] .surface-mid {

    top: 20%;
    height: 38%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 46% 9% at 8% 38%,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 40% 8% at 57% 28%,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 44% 9% at 91% 67%,
            rgba(255,255,255,.11) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        surfaceMid 13s ease-in-out infinite;
}


/* ---------------------------------------------------------
   Light Surface Near
--------------------------------------------------------- */

.scene[data-theme="light"] .surface-near {

    top: 43%;
    height: 50%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 52% 11% at 24% 36%,
            rgba(255,255,255,.11) 0%,
            rgba(255,255,255,0) 70%
        ),
        radial-gradient(
            ellipse 46% 10% at 72% 58%,
            rgba(255,255,255,.09) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        surfaceNear 16s ease-in-out infinite;
}


/* =========================================================
   Light Water Gaps
========================================================= */

.scene[data-theme="light"] .water-gaps {

    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse 22% 4% at 18% 18%,
            rgba(255,255,255,.08),
            transparent 72%
        ),
        radial-gradient(
            ellipse 28% 5% at 76% 30%,

            transparent 72%
        ),
        radial-gradient(

            rgba(255,255,255,.06),
            transparent 72%
        ),
        radial-gradient(
            ellipse 34% 6% at 83% 76%,

/* =========================================================
   Dark Water Gaps
========================================================= */

.scene[data-theme="dark"] .water-gaps {

    position: absolute;
    inset: 0;

    background:

            transparent 38%

            rgba(185,200,210,.04) 0%,
            transparent 40%
        ),
        radial-gradient(
            ellipse at 42% 67%,

            transparent 45%
        );

    opacity: .88;

    animation:
        waterAtmosphere 13s ease-in-out infinite alternate;

/* =========================================================
   Island Reflection
========================================================= */

.island-shadow {

    position: absolute;

    left: 50%;

    top:
        calc(
            37.5vh
            + var(--reflection-offset)
        );

    /*
     * 島の直下に寄せる。
     * 元の108:48を維持。
     */
    width:
        calc(
            var(--island-size) * .78
        );

    aspect-ratio: 108 / 48;
    height: auto;

    transform: translateX(-50%);

    border-radius: 50%;

    pointer-events: none;

    z-index: 31;
}


/* =========================================================
   DARK — Reflection
========================================================= */

.scene[data-theme="dark"] .island-shadow {

    background:
        radial-gradient(
            ellipse at center,
            rgba(165,185,195,.075) 0%,
            rgba(135,155,165,.045) 25%,
            rgba(100,120,130,.022) 50%,
            rgba(70,90,100,.008) 70%,
            transparent 100%
        );

    filter: blur(4px);

    animation:
        reflectionPulseDark 5.5s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .island-shadow::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 1px;

    width:
        calc(
            var(--island-size) * .66
        );

    aspect-ratio: 92 / 19;
    height: auto;

    transform: translateX(-50%);

    border-top:
        1px solid
        rgba(190,205,210,.045);

    border-left:
        1px solid
        rgba(180,195,205,.012);

    border-right:
        1px solid
        rgba(180,195,205,.012);

    border-radius: 50%;

    filter: blur(.6px);

    animation:
        reflectionLineDark 6.5s ease-in-out infinite alternate;
}

   LIGHT — Reflection

   島の真下に近く、
   横方向へ広がりすぎない。
   「存在が水面に落ちている」程度。
========================================================= */

    width:

            var(--island-size) * .72

            rgba(55,101,105,.018) 47%,

    opacity: .72;

    animation:
        reflectionPulseLight 6s ease-in-out infinite alternate;
}

    content: "";

    position: absolute;

    left: 50%;
    top: 1px;

        calc(

    border-right:

    ===================================================== -->

    <div class="brand">

        <h1 class="brand-name">
            esenus
        </h1>

        <div class="brand-status">
            <span class="status-dot"></span>
            awaiting initialization
        </div>

    </div>


    <!-- =====================================================
         Theme Toggle
    ===================================================== -->

    <button
        class="theme-toggle"
        type="button"
        aria-label="ライトモードに切り替える"
        aria-pressed="false"
    >
        <span class="theme-toggle-icon">◐</span>
        <span class="theme-toggle-label">LIGHT</span>
    </button>

</main>


<script>
(() => {

    const scene =
        document.querySelector(".scene");

    const toggle =
        document.querySelector(".theme-toggle");

    const icon =
        toggle.querySelector(".theme-toggle-icon");

    const label =
        toggle.querySelector(".theme-toggle-label");


    /* =====================================================
       Theme
    ===================================================== */

    let savedTheme = null;

    try {
        savedTheme =
            localStorage.getItem("esenus-theme");
    } catch (error) {
        savedTheme = null;
    }


    const initialTheme =
        savedTheme === "light"
            ? "light"
            : "dark";


    scene.dataset.theme =
        initialTheme;


    /* =====================================================
       Update Toggle UI
    ===================================================== */

    function updateToggle() {

        const isLight =
            scene.dataset.theme === "light";


        /*
         * ボタンに表示するのは
         * 「次に切り替えられるテーマ」。
         */

        label.textContent =
            isLight
                ? "DARK"
                : "LIGHT";


        icon.textContent =
            isLight
                ? "○"
                : "◐";


        toggle.setAttribute(
            "aria-pressed",
            String(isLight)
        );


        toggle.setAttribute(
            "aria-label",
            isLight
                ? "ダークモードに切り替える"
                : "ライトモードに切り替える"
        );
    }


    /* =====================================================
       Toggle
    ===================================================== */

    toggle.addEventListener(
        "click",
        () => {

            const nextTheme =
                scene.dataset.theme === "dark"
                    ? "light"
                    : "dark";


            scene.dataset.theme =
                nextTheme;


            try {
                localStorage.setItem(
                    "esenus-theme",
                    nextTheme
                );
            } catch (error) {
                /* localStorage unavailable */
            }


            updateToggle();
        }
    );


    updateToggle();

})();
</script>

</body>
</html>
