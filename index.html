<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>esenus</title>

<style>

:root {
    --sky-top: #070a18;
    --sky-mid: #10142b;
    --sky-bottom: #171936;

    --sea-top: #111f42;
    --sea-mid: #0d1939;
    --sea-bottom: #060b1e;

    --cyan: rgba(73, 224, 255, 1);
    --blue: rgba(76, 139, 255, 1);
    --violet: rgba(132, 91, 255, 1);
    --magenta: rgba(215, 75, 255, 1);

    --text: rgba(218, 246, 255, 0.86);
    --subtext: rgba(130, 205, 231, 0.52);
}


/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050817;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}


/* =========================================================
   SCENE
   ========================================================= */

.scene {
    position: relative;

    width: 100%;
    height: 100svh;
    min-height: 520px;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #070a18 0%,
            #0c1025 16%,
            #11152e 31%,
            #171936 42%,
            #111c3c 42%,
            #0d1835 65%,
            #070d22 100%
        );
}


/* =========================================================
   ATMOSPHERE
   ========================================================= */

.atmosphere {
    position: absolute;
    inset: 0;

    z-index: 1;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 50% 33%,
            rgba(75, 220, 255, 0.14),
            rgba(71, 139, 255, 0.07) 25%,
            transparent 62%
        ),

        radial-gradient(
            ellipse at 50% 4%,
            rgba(141, 83, 255, 0.12),
            transparent 48%
        ),

        radial-gradient(
            ellipse at 78% 37%,
            rgba(222, 69, 255, 0.055),
            transparent 50%
        ),

        radial-gradient(
            ellipse at 18% 44%,
            rgba(62, 169, 255, 0.045),
            transparent 52%
        );

    animation:
        atmosphereBreath 7s ease-in-out infinite;
}

@keyframes atmosphereBreath {

    0%,
    100% {
        opacity: 0.68;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.035);
    }
}


/* =========================================================
   SKY PARTICLES
   ========================================================= */

.scene::before {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    background-image:

        radial-gradient(
            circle at 14% 18%,
            rgba(84, 221, 255, 0.65) 0 0.7px,
            transparent 1.8px
        ),

        radial-gradient(
            circle at 29% 11%,
            rgba(144, 112, 255, 0.55) 0 0.8px,
            transparent 1.8px
        ),

        radial-gradient(
            circle at 43% 24%,
            rgba(88, 210, 255, 0.45) 0 0.6px,
            transparent 1.6px
        ),

        radial-gradient(
            circle at 63% 13%,
            rgba(218, 104, 255, 0.52) 0 0.8px,
            transparent 1.8px
        ),

        radial-gradient(
            circle at 79% 23%,
            rgba(77, 214, 255, 0.58) 0 0.7px,
            transparent 1.8px
        ),

        radial-gradient(
            circle at 91% 9%,
            rgba(130, 143, 255, 0.45) 0 0.7px,
            transparent 1.7px
        ),

        radial-gradient(
            circle at 7% 33%,
            rgba(98, 195, 255, 0.40) 0 0.6px,
            transparent 1.6px
        ),

        radial-gradient(
            circle at 87% 35%,
            rgba(213, 92, 255, 0.45) 0 0.7px,
            transparent 1.7px
        );

    opacity: 0.65;

    animation:
        skyParticles 5.5s ease-in-out infinite alternate;
}

@keyframes skyParticles {

    0% {
        opacity: 0.28;
        transform: translateY(3px);
    }

    35% {
        opacity: 0.72;
    }

    70% {
        opacity: 0.42;
    }

    100% {
        opacity: 0.9;
        transform: translateY(-4px);
    }
}


/* =========================================================
   GIANT UNKNOWN OBJECT
   ========================================================= */

.island-window {
    position: absolute;

    left: 50%;
    top: calc(37.5vh - clamp(20px, 3.6vw, 36px));

    width: clamp(100px, 18vw, 180px);
    height: clamp(20px, 3.6vw, 36px);

    transform: translateX(-50%);

    overflow: hidden;

    z-index: 30;
}


.island {
    position: absolute;

    left: 0;
    top: 0;

    width: clamp(100px, 18vw, 180px);
    height: clamp(100px, 18vw, 180px);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 50% 50%,
            transparent 63%,
            rgba(64, 213, 255, 0.18) 70%,
            rgba(102, 112, 255, 0.32) 77%,
            rgba(216, 73, 255, 0.28) 84%,
            transparent 100%
        ),

        radial-gradient(
            circle at 50% 36%,
            rgba(182, 235, 255, 0.88) 0%,
            rgba(101, 181, 255, 0.78) 32%,
            rgba(82, 103, 231, 0.68) 55%,
            rgba(158, 70, 226, 0.56) 74%,
            rgba(158, 70, 226, 0) 100%
        );

    filter:
        blur(0.65px)
        drop-shadow(0 0 8px rgba(67, 217, 255, 0.20))
        drop-shadow(0 0 18px rgba(161, 78, 255, 0.15));

    opacity: 0.9;

    transform-origin: center center;

    animation:
        islandBreath 6s ease-in-out infinite;
}

.island::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse at 50% 10%,
            rgba(221, 250, 255, 0.82),
            rgba(105, 225, 255, 0.30) 30%,
            transparent 68%
        ),

        radial-gradient(
            ellipse at 66% 64%,
            rgba(215, 79, 255, 0.35),
            transparent 56%
        );

    filter: blur(0.8px);

    opacity: 0.92;
}

.island::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    bottom: 7px;

    height: 35%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(68, 209, 255, 0.35),
            rgba(97, 99, 240, 0.20) 40%,
            rgba(184, 70, 235, 0.08) 63%,
            transparent 84%
        );

    filter: blur(5px);

    opacity: 0.85;
}

@keyframes islandBreath {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);
    }

    50% {
        transform:
            scaleX(1.018)
            scaleY(0.985);
    }
}


/* =========================================================
   GAP
   ========================================================= */

.island-gap-mist {
    position: absolute;

    left: 50%;
    top: calc(37.5vh - clamp(8px, 1.4vw, 14px));

    width: clamp(128px, 23vw, 230px);
    height: clamp(10px, 1.8vw, 18px);

    transform: translateX(-50%);

    z-index: 28;

    background:
        radial-gradient(
            ellipse at center,
            rgba(75, 222, 255, 0.20),
            rgba(110, 120, 255, 0.10) 40%,
            rgba(215, 72, 255, 0.06) 58%,
            transparent 80%
        );

    filter: blur(4px);

    opacity: 0.72;

    animation:
        gapPulse 3.8s ease-in-out infinite;
}

@keyframes gapPulse {

    0%,
    100% {
        opacity: 0.35;
    }

    50% {
        opacity: 0.85;
    }
}


/* =========================================================
   HORIZON
   ========================================================= */

.horizon {
    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;

    height: 1px;

    z-index: 34;

    background:
        linear-gradient(
            to right,
            transparent 0%,
            rgba(65, 203, 255, 0.16) 12%,
            rgba(74, 219, 255, 0.50) 30%,
            rgba(187, 112, 255, 0.90) 50%,
            rgba(74, 219, 255, 0.50) 70%,
            rgba(65, 203, 255, 0.16) 88%,
            transparent 100%
        );

    box-shadow:
        0 0 4px rgba(72, 216, 255, 0.28),
        0 0 12px rgba(130, 95, 255, 0.20);

    filter: blur(0.25px);

    animation:
        horizonPulse 3.2s ease-in-out infinite;
}

@keyframes horizonPulse {

    0%,
    100% {
        opacity: 0.65;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================================
   OCEAN
   ========================================================= */

.ocean {
    position: absolute;

    inset: 37.5vh 0 0;

    z-index: 5;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #111f42 0%,
            #0d1939 38%,
            #09122d 68%,
            #060b1e 100%
        );
}


/* =========================================================
   DISTANT WAVES
   =========================================================
   横移動なし。
   波紋そのものの位置は固定。
   ========================================================= */

.ocean::before {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 6;

    background:

        radial-gradient(
            ellipse 90px 1.4px at 12% 18%,
            rgba(67, 220, 255, 0.42),
            transparent 70%
        ),

        radial-gradient(
            ellipse 150px 1.2px at 31% 27%,
            rgba(80, 192, 255, 0.34),
            transparent 70%
        ),

        radial-gradient(
            ellipse 110px 1.5px at 68% 16%,
            rgba(104, 224, 255, 0.42),
            transparent 70%
        ),

        radial-gradient(
            ellipse 180px 1.2px at 87% 31%,
            rgba(105, 151, 255, 0.30),
            transparent 70%
        ),

        radial-gradient(
            ellipse 130px 1.2px at 48% 39%,
            rgba(170, 113, 255, 0.30),
            transparent 70%
        ),

        radial-gradient(
            ellipse 80px 1px at 72% 44%,
            rgba(61, 221, 255, 0.35),
            transparent 70%
        );

    transform-origin: center center;

    animation:
        distantWaves 6s ease-in-out infinite;
}

@keyframes distantWaves {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.55;
    }

    25% {
        transform:
            scaleX(1.018)
            scaleY(1.025);

        opacity: 0.78;
    }

    50% {
        transform:
            scaleX(0.985)
            scaleY(0.97);

        opacity: 0.48;
    }

    75% {
        transform:
            scaleX(1.012)
            scaleY(1.018);

        opacity: 0.70;
    }
}


/* =========================================================
   NEAR WAVES
   ========================================================= */

.ocean::after {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 7;

    background:

        radial-gradient(
            ellipse 140px 2px at 8% 62%,
            rgba(54, 221, 255, 0.42),
            transparent 72%
        ),

        radial-gradient(
            ellipse 210px 1.8px at 26% 78%,
            rgba(62, 194, 255, 0.34),
            transparent 72%
        ),

        radial-gradient(
            ellipse 170px 2px at 51% 58%,
            rgba(75, 221, 255, 0.40),
            transparent 72%
        ),

        radial-gradient(
            ellipse 240px 1.7px at 74% 84%,
            rgba(120, 108, 255, 0.32),
            transparent 72%
        ),

        radial-gradient(
            ellipse 160px 2px at 94% 67%,
            rgba(70, 209, 255, 0.38),
            transparent 72%
        ),

        radial-gradient(
            ellipse 180px 1.5px at 48% 91%,
            rgba(195, 82, 255, 0.20),
            transparent 72%
        );

    transform-origin: center center;

    animation:
        nearWaves 4.2s ease-in-out infinite;
}

@keyframes nearWaves {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.50;
    }

    30% {
        transform:
            scaleX(1.025)
            scaleY(1.035);

        opacity: 0.78;
    }

    60% {
        transform:
            scaleX(0.975)
            scaleY(0.965);

        opacity: 0.44;
    }

    80% {
        transform:
            scaleX(1.018)
            scaleY(1.02);

        opacity: 0.66;
    }
}


/* =========================================================
   WATER
   ========================================================= */

.water {
    position: absolute;
    inset: 0;

    z-index: 8;

    background:

        radial-gradient(
            ellipse 260px 2px at 18% 46%,
            rgba(66, 220, 255, 0.22),
            transparent 72%
        ),

        radial-gradient(
            ellipse 320px 2px at 78% 51%,
            rgba(81, 190, 255, 0.22),
            transparent 72%
        ),

        radial-gradient(
            ellipse 200px 1.5px at 42% 69%,
            rgba(128, 103, 255, 0.25),
            transparent 72%
        ),

        radial-gradient(
            ellipse 180px 1.5px at 63% 88%,
            rgba(211, 78, 255, 0.13),
            transparent 72%
        );

    transform-origin: center center;

    animation:
        waterPulse 5.5s ease-in-out infinite;
}

@keyframes waterPulse {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.72;
    }

    50% {
        transform:
            scaleX(1.018)
            scaleY(1.025);

        opacity: 1;
    }
}


/* =========================================================
   SURFACE FAR
   ========================================================= */

.surface-far {
    position: absolute;
    inset: 0;

    z-index: 8;

    background:
        repeating-radial-gradient(
            ellipse at 50% 0%,
            transparent 0 11px,
            rgba(72, 209, 255, 0.075) 12px,
            transparent 14px 28px
        );

    opacity: 0.82;

    transform-origin: center center;

    animation:
        surfaceFar 8s ease-in-out infinite;
}

@keyframes surfaceFar {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.58;
    }

    50% {
        transform:
            scaleX(1.012)
            scaleY(1.025);

        opacity: 0.92;
    }
}


/* =========================================================
   SURFACE MID
   ========================================================= */

.surface-mid {
    position: absolute;
    inset: 0;

    z-index: 8;

    background:

        radial-gradient(
            ellipse 200px 1px at 20% 52%,
            rgba(65, 218, 255, 0.30),
            transparent 72%
        ),

        radial-gradient(
            ellipse 250px 1px at 65% 64%,
            rgba(91, 194, 255, 0.27),
            transparent 72%
        ),

        radial-gradient(
            ellipse 170px 1px at 88% 48%,
            rgba(148, 105, 255, 0.25),
            transparent 72%
        ),

        radial-gradient(
            ellipse 220px 1px at 35% 88%,
            rgba(215, 77, 255, 0.16),
            transparent 72%
        );

    transform-origin: center center;

    animation:
        surfaceMid 4.8s ease-in-out infinite;
}

@keyframes surfaceMid {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.58;
    }

    50% {
        transform:
            scaleX(1.025)
            scaleY(1.04);

        opacity: 0.90;
    }
}


/* =========================================================
   SURFACE NEAR
   ========================================================= */

.surface-near {
    position: absolute;
    inset: 0;

    z-index: 8;

    background:

        radial-gradient(
            ellipse 300px 2px at 30% 82%,
            rgba(62, 208, 255, 0.23),
            transparent 74%
        ),

        radial-gradient(
            ellipse 260px 2px at 75% 74%,
            rgba(123, 103, 255, 0.23),
            transparent 74%
        ),

        radial-gradient(
            ellipse 340px 2px at 50% 94%,
            rgba(202, 76, 255, 0.14),
            transparent 74%
        );

    transform-origin: center center;

    animation:
        surfaceNear 3.8s ease-in-out infinite;
}

@keyframes surfaceNear {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.52;
    }

    50% {
        transform:
            scaleX(1.035)
            scaleY(1.045);

        opacity: 0.88;
    }
}


/* =========================================================
   WATER GAPS
   ========================================================= */

.water-gaps {
    position: absolute;
    inset: 0;

    z-index: 8;

    background:

        radial-gradient(
            ellipse 100px 1px at 14% 42%,
            rgba(52, 127, 187, 0.28),
            transparent 75%
        ),

        radial-gradient(
            ellipse 140px 1px at 38% 52%,
            rgba(69, 112, 194, 0.22),
            transparent 75%
        ),

        radial-gradient(
            ellipse 120px 1px at 62% 43%,
            rgba(91, 102, 205, 0.25),
            transparent 75%
        ),

        radial-gradient(
            ellipse 150px 1px at 86% 57%,
            rgba(58, 128, 190, 0.23),
            transparent 75%
        );

    transform-origin: center center;

    animation:
        gapsPulse 6.5s ease-in-out infinite;
}

@keyframes gapsPulse {

    0%,
    100% {
        transform:
            scaleX(1)
            scaleY(1);

        opacity: 0.50;
    }

    50% {
        transform:
            scaleX(1.02)
            scaleY(1.03);

        opacity: 0.82;
    }
}


/* =========================================================
   LIGHT SWEEP
   ========================================================= */

.ocean-light {
    position: absolute;

    left: -20%;

    width: 140%;
    height: 1px;

    z-index: 10;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(61, 220, 255, 0) 15%,
            rgba(72, 221, 255, 0.45) 35%,
            rgba(145, 103, 255, 0.30) 50%,
            rgba(72, 221, 255, 0.45) 65%,
            rgba(61, 220, 255, 0) 85%,
            transparent
        );

    filter: blur(0.5px);

    opacity: 0;

    /*
       横方向に走査する光。
       これは波紋ではないので残す。
    */
    animation:
        lightSweep 4.8s ease-in-out infinite;
}

.ocean-light.one {
    top: 18%;
}

.ocean-light.two {
    top: 38%;
    animation-delay: 1.8s;
}

.ocean-light.three {
    top: 62%;
    animation-delay: 3.1s;
}

@keyframes lightSweep {

    0% {
        transform: translateX(-20%);
        opacity: 0;
    }

    20% {
        opacity: 0.12;
    }

    50% {
        opacity: 0.55;
    }

    75% {
        opacity: 0.18;
    }

    100% {
        transform: translateX(20%);
        opacity: 0;
    }
}


/* =========================================================
   CENTRAL REFLECTION
   ========================================================= */

.island-shadow {
    position: absolute;

    left: 50%;
    top: calc(37.5vh + 3px);

    width: clamp(108px, 19.5vw, 195px);
    height: clamp(48px, 8.7vw, 87px);

    transform:
        translateX(-50%)
        scaleX(1)
        scaleY(1);

    transform-origin:
        center top;

    z-index: 31;

    pointer-events: none;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(58, 218, 255, 0.34) 0%,
            rgba(84, 121, 255, 0.26) 28%,
            rgba(150, 81, 255, 0.18) 48%,
            rgba(196, 70, 255, 0.07) 65%,
            transparent 82%
        );

    filter:
        blur(4px)
        drop-shadow(
            0 0 9px rgba(62, 204, 255, 0.10)
        );

    opacity: 0.78;

    animation:
        reflectionPulse 5.2s ease-in-out infinite;
}

@keyframes reflectionPulse {

    0%,
    100% {
        transform:
            translateX(-50%)
            scaleX(1)
            scaleY(1);

        opacity: 0.60;
    }

    25% {
        transform:
            translateX(-50%)
            scaleX(1.025)
            scaleY(0.96);

        opacity: 0.78;
    }

    50% {
        transform:
            translateX(-50%)
            scaleX(1.055)
            scaleY(0.82);

        opacity: 0.46;
    }

    75% {
        transform:
            translateX(-50%)
            scaleX(1.018)
            scaleY(0.92);

        opacity: 0.68;
    }
}


/* =========================================================
   CENTRAL REFLECTION LINE
   ========================================================= */

.island-shadow::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 2px;

    width: clamp(92px, 16.56vw, 166px);
    height: clamp(19px, 3.42vw, 34px);

    transform:
        translateX(-50%)
        scaleX(1);

    transform-origin:
        center top;

    border-radius: 50%;

    border-top:
        1px solid rgba(76, 222, 255, 0.30);

    border-left:
        1px solid rgba(103, 133, 255, 0.12);

    border-right:
        1px solid rgba(180, 83, 255, 0.10);

    filter:
        blur(0.45px);

    opacity: 0.55;

    animation:
        reflectionLine 5.2s ease-in-out infinite;
}

@keyframes reflectionLine {

    0%,
    100% {
        transform:
            translateX(-50%)
            scaleX(1);

        opacity: 0.40;
    }

    25% {
        transform:
            translateX(-50%)
            scaleX(1.015);

        opacity: 0.62;
    }

    50% {
        transform:
            translateX(-50%)
            scaleX(1.04);

        opacity: 0.30;
    }

    75% {
        transform:
            translateX(-50%)
            scaleX(1.012);

        opacity: 0.52;
    }
}


/* =========================================================
   OCEAN MIST
   ========================================================= */

.ocean-mist {
    position: absolute;

    left: 0;
    right: 0;

    top: 36vh;

    height: 12vh;

    z-index: 32;

    background:
        linear-gradient(
            to bottom,
            rgba(68, 202, 255, 0.12),
            rgba(108, 87, 255, 0.055),
            transparent
        );

    filter: blur(7px);

    opacity: 0.58;

    pointer-events: none;

    animation:
        mistPulse 5s ease-in-out infinite;
}

@keyframes mistPulse {

    0%,
    100% {
        opacity: 0.38;
    }

    50% {
        opacity: 0.72;
    }
}


/* =========================================================
   BRAND
   ========================================================= */

.brand {
    position: absolute;

    left: 50%;
    bottom: 8.5vh;

    transform: translateX(-50%);

    z-index: 40;

    width: min(86vw, 320px);

    display: flex;
    flex-direction: column;
    align-items: center;

    color: var(--text);

    user-select: none;
}


.brand-name {
    position: relative;

    margin: 0;

    font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

    font-size: 18px;

    font-weight: 300;

    line-height: 1;

    letter-spacing: 0.28em;

    padding-left: 0.28em;

    color:
        rgba(225, 249, 255, 0.90);

    text-shadow:
        0 0 7px rgba(73, 219, 255, 0.25),
        0 0 17px rgba(112, 106, 255, 0.15),
        0 0 30px rgba(199, 75, 255, 0.08);

    opacity: 0.92;

    white-space: nowrap;

    animation:
        logoGlow 4s ease-in-out infinite;
}

@keyframes logoGlow {

    0%,
    100% {
        opacity: 0.72;

        text-shadow:
            0 0 6px rgba(73, 219, 255, 0.16),
            0 0 15px rgba(112, 106, 255, 0.08);
    }

    50% {
        opacity: 1;

        text-shadow:
            0 0 9px rgba(73, 219, 255, 0.30),
            0 0 20px rgba(112, 106, 255, 0.18),
            0 0 32px rgba(199, 75, 255, 0.10);
    }
}


.brand-line {
    position: relative;

    width: 54px;
    height: 1px;

    margin-top: 13px;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(73, 221, 255, 0.42),
            rgba(169, 110, 255, 0.50),
            transparent
        );

    box-shadow:
        0 0 6px rgba(76, 210, 255, 0.18);

    opacity: 0.75;

    animation:
        linePulse 3s ease-in-out infinite;
}

@keyframes linePulse {

    0%,
    100% {
        width: 42px;
        opacity: 0.40;
    }

    50% {
        width: 66px;
        opacity: 0.90;
    }
}


.brand-status {
    margin-top: 10px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        "Consolas",
        monospace;

    font-size: 7px;

    font-weight: 400;

    line-height: 1;

    letter-spacing: 0.18em;

    color:
        rgba(126, 211, 236, 0.56);

    text-transform: lowercase;

    white-space: nowrap;
}


.status-indicator {
    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        rgba(75, 224, 255, 0.80);

    box-shadow:
        0 0 5px rgba(75, 224, 255, 0.60),
        0 0 11px rgba(75, 224, 255, 0.24);

    animation:
        statusPulse 2.5s ease-in-out infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: 0.20;
        transform: scale(0.7);
    }

    35% {
        opacity: 1;
        transform: scale(1.2);
    }

    60% {
        opacity: 0.55;
        transform: scale(0.9);
    }
}


.brand-meta {
    margin-top: 8px;

    font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        "Consolas",
        monospace;

    font-size: 5.5px;

    line-height: 1;

    letter-spacing: 0.14em;

    color:
        rgba(101, 178, 210, 0.28);

    opacity: 0.85;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .scene {
        min-height: 500px;
    }

    .island-window {
        top: calc(37.5vh - clamp(20px, 3.6vw, 36px));

        width: clamp(100px, 18vw, 180px);
        height: clamp(20px, 3.6vw, 36px);
    }

    .island {
        width: clamp(100px, 18vw, 180px);
        height: clamp(100px, 18vw, 180px);
    }

    .island-shadow {
        top: calc(37.5vh + 3px);

        width: clamp(108px, 19.5vw, 195px);
        height: clamp(48px, 8.7vw, 87px);
    }

    .island-gap-mist {
        width: clamp(124px, 23vw, 230px);
    }

    .brand {
        bottom: 8vh;
    }

    .brand-name {
        font-size: 15px;

        letter-spacing: 0.26em;

        padding-left: 0.26em;
    }

    .brand-line {
        width: 46px;

        margin-top: 11px;
    }

    .brand-status {
        margin-top: 9px;

        font-size: 6.5px;

        letter-spacing: 0.16em;
    }

    .brand-meta {
        margin-top: 7px;

        font-size: 5px;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>


<body>

<div class="scene">

    <div class="atmosphere"></div>


    <!-- 巨大な円 -->
    <div class="island-window">
        <div class="island"></div>
    </div>


    <!-- 円と水平線の間 -->
    <div class="island-gap-mist"></div>


    <!-- 海面 -->
    <div class="ocean">

        <div class="water"></div>

        <div class="surface-far"></div>

        <div class="surface-mid"></div>

        <div class="surface-near"></div>

        <div class="water-gaps"></div>

        <div class="ocean-light one"></div>
        <div class="ocean-light two"></div>
        <div class="ocean-light three"></div>

    </div>


    <!-- 中央反射 -->
    <div class="island-shadow"></div>


    <!-- 水平線 -->
    <div class="horizon"></div>


    <!-- 海霧 -->
    <div class="ocean-mist"></div>


    <!-- ブランド -->
    <div class="brand">

        <div class="brand-name">
            esenus
        </div>

        <div class="brand-line"></div>

        <div class="brand-status">

            <span class="status-indicator"></span>

            <span>
                awaiting initialization
            </span>

        </div>

        <div class="brand-meta">
            system / 00.00.00
        </div>

    </div>

</div>

</body>
</html>
