<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>esenus</title>

<style>

/* =========================================================
   Shared Geometry
========================================================= */

:root {
    --island-size: clamp(100px, 18vw, 180px);
    --island-window-height: calc(var(--island-size) * 0.20);

    /* Island bottom ↔ horizon */
    --island-horizon-gap: 4px;

    /* Reflection position */
    --reflection-offset: 1px;
}


/* =========================================================
   Base
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}


/* =========================================================
   Scene
========================================================= */

.scene {
    position: relative;

    width: 100%;
    height: 100svh;
    min-height: 520px;

    overflow: hidden;
}


/* =========================================================
   DARK THEME
========================================================= */

.scene[data-theme="dark"] {

    --sky-top: #05070a;
    --sky-mid: #0b1016;
    --sky-bottom: #101820;

    --sea-top: #101920;
    --sea-mid: #0b1218;
    --sea-bottom: #05090d;

    --text: rgba(220, 230, 235, 0.72);

    background:
        linear-gradient(
            to bottom,
            var(--sky-top) 0%,
            var(--sky-mid) 23%,
            var(--sky-bottom) 42%,
            var(--sea-top) 42%,
            var(--sea-mid) 70%,
            var(--sea-bottom) 100%
        );
}


/* =========================================================
   LIGHT THEME
========================================================= */

.scene[data-theme="light"] {

    --sky-top: #eaf2f5;
    --sky-mid: #e5eef2;
    --sky-bottom: #e0ebef;

    --sea-top: #dce9ee;
    --sea-mid: #cfe2e9;
    --sea-bottom: #bcd6df;

    --text: rgba(35, 57, 66, 0.48);

    background:
        linear-gradient(
            180deg,
            #eaf2f5 0%,
            #e5eef2 27%,
            #e0ebef 48%,
            #dce9ee 100%
        );
}


/* =========================================================
   Atmosphere — Dark
========================================================= */

.scene[data-theme="dark"] .atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 2;

    background:
        radial-gradient(
            ellipse at 50% 36%,
            rgba(150, 175, 190, 0.05) 0%,
            rgba(100, 125, 140, 0.025) 30%,
            transparent 65%
        );
}


/* =========================================================
   Atmosphere — Light
========================================================= */

.scene[data-theme="light"] .atmosphere {
    position: absolute;
    inset: 0;

    z-index: 1;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 38%,
            rgba(255,255,255,0.56) 0%,
            rgba(255,255,255,0.26) 27%,
            rgba(255,255,255,0) 65%
        );

    animation:
        atmosphereBreath 12s ease-in-out infinite;
}


/* =========================================================
   Light Atmosphere Animation
========================================================= */

@keyframes atmosphereBreath {

    0%,
    100% {
        opacity: .72;
        transform: scale(1);
    }

    50% {
        opacity: .92;
        transform: scale(1.025);
    }
}


/* =========================================================
   Stars — Dark only
========================================================= */

.scene[data-theme="dark"] .atmosphere::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 11% 18%,
            rgba(220, 230, 235, 0.38) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 19% 31%,
            rgba(220, 230, 235, 0.22) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 27% 13%,
            rgba(220, 230, 235, 0.28) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 34% 25%,
            rgba(220, 230, 235, 0.18) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 42% 9%,
            rgba(220, 230, 235, 0.30) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 51% 20%,
            rgba(220, 230, 235, 0.20) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 59% 12%,
            rgba(220, 230, 235, 0.30) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 67% 27%,
            rgba(220, 230, 235, 0.20) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 74% 15%,
            rgba(220, 230, 235, 0.32) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 82% 24%,
            rgba(220, 230, 235, 0.20) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 91% 11%,
            rgba(220, 230, 235, 0.28) 0 0.7px,
            transparent 1.3px
        ),
        radial-gradient(
            circle at 87% 34%,
            rgba(220, 230, 235, 0.16) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 7% 37%,
            rgba(220, 230, 235, 0.18) 0 0.6px,
            transparent 1.2px
        ),
        radial-gradient(
            circle at 31% 36%,
            rgba(220, 230, 235, 0.15) 0 0.6px,
            transparent 1.2px
        );

    opacity: 0.72;

    animation:
        starLight 11s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .atmosphere::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 30%;
    height: 20%;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(190, 210, 220, 0.055) 0%,
            rgba(150, 175, 190, 0.025) 38%,
            transparent 75%
        );

    filter: blur(14px);

    animation:
        skyLight 17s ease-in-out infinite alternate;
}


/* =========================================================
   Island Window — Shared
========================================================= */

.island-window {
    position: absolute;

    left: 50%;

    top:
        calc(
            37.5vh
            - var(--island-window-height)
            - var(--island-horizon-gap)
        );

    width: var(--island-size);
    height: var(--island-window-height);

    transform: translateX(-50%);

    overflow: hidden;

    z-index: 30;

    pointer-events: none;
}


/* =========================================================
   Island — Dark
========================================================= */

.scene[data-theme="dark"] .island {

    position: absolute;

    left: 0;
    top: 0;

    width: var(--island-size);
    height: var(--island-size);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(105, 119, 126, 0.30) 0%,
            rgba(76, 88, 95, 0.27) 28%,
            rgba(43, 52, 58, 0.24) 57%,
            rgba(18, 24, 28, 0.16) 76%,
            rgba(10, 14, 17, 0) 100%
        );

    filter: blur(1.8px);

    transform-origin: center center;

    animation:
        islandDriftDark 9s ease-in-out infinite alternate;
}


/* =========================================================
   Island — Light
========================================================= */

.scene[data-theme="light"] .island {

    position: absolute;

    left: 0;
    top: 0;

    width: var(--island-size);
    height: var(--island-size);

    border-radius: 50%;

    /*
     * Darker grayではなく、
     * かなり薄い blue-green。
     *
     * 上端よりも下端へ向かって透明になる。
     */
    background:
        radial-gradient(
            ellipse at 50% 32%,
            rgba(62, 116, 119, 0.16) 0%,
            rgba(57, 108, 112, 0.125) 24%,
            rgba(52, 101, 106, 0.09) 45%,
            rgba(49, 96, 101, 0.055) 63%,
            rgba(49, 96, 101, 0.018) 76%,
            rgba(49, 96, 101, 0) 88%
        ),
        radial-gradient(
            ellipse at 50% 72%,
            rgba(48, 94, 99, 0.055) 0%,
            rgba(48, 94, 99, 0.025) 42%,
            rgba(48, 94, 99, 0) 72%
        );

    /*
     * 島の輪郭を残しつつ、
     * 下端だけ少し空気に溶かす。
     */
    filter:
        blur(1.05px)
        saturate(.78);

    opacity: .82;

    transform-origin: center center;

    animation:
        islandDriftLight 14s ease-in-out infinite;
}


/* =========================================================
   Island Upper Haze — Light
========================================================= */

.scene[data-theme="light"] .island::before {
    content: "";

    position: absolute;

    left: 3%;
    right: 3%;
    top: 1%;

    height: 42%;

    border-radius:
        50%
        50%
        35%
        35% /
        90%
        90%
        35%
        35%;

    background:
        radial-gradient(
            ellipse at 50% 100%,
            rgba(48, 98, 103, .075) 0%,
            rgba(52, 101, 106, .05) 42%,
            rgba(70, 115, 119, .018) 68%,
            rgba(105, 137, 141, 0) 100%
        );

    filter: blur(1px);

    opacity: .78;
}


/* =========================================================
   Island Lower Haze — Light
========================================================= */

.scene[data-theme="light"] .island::after {
    content: "";

    position: absolute;

    left: -10%;
    right: -10%;
    bottom: 5px;

    height: 36%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 28%,
            rgba(220, 239, 241, .10) 0%,
            rgba(220, 239, 241, .045) 42%,
            rgba(220, 239, 241, 0) 82%
        );

    filter: blur(6px);

    opacity: .72;
}


/* =========================================================
   Gap Mist — Dark
========================================================= */

.scene[data-theme="dark"] .island-gap-mist {

    position: absolute;

    left: 50%;
    top: calc(37.5vh - var(--island-horizon-gap));

    width: calc(var(--island-size) * 1.28);
    height: 9px;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse at center,
            rgba(190, 205, 210, 0.10) 0%,
            rgba(165, 185, 195, 0.045) 38%,
            transparent 75%
        );

    filter: blur(4px);

    z-index: 32;

    animation:
        gapMistDark 9s ease-in-out infinite alternate;
}


/* =========================================================
   Gap Mist — Light
========================================================= */

.scene[data-theme="light"] .island-gap-mist {

    position: absolute;

    left: 50%;
    top: calc(37.5vh - var(--island-horizon-gap));

    /*
     * 4pxという実寸の隙間を
     * 光の帯で大きく見せない。
     */
    width: calc(var(--island-size) * 1.02);
    height: 6px;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse at center,
            rgba(225, 239, 241, .055) 0%,
            rgba(215, 232, 235, .018) 42%,
            rgba(215, 232, 235, 0) 76%
        );

    filter: blur(3px);

    opacity: .42;

    z-index: 32;

    animation:
        gapMistLight 11s ease-in-out infinite alternate;
}


/* =========================================================
   Horizon — Dark
========================================================= */

.scene[data-theme="dark"] .horizon {

    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;

    height: 1px;

    background:
        linear-gradient(
            to right,
            transparent 0%,
            rgba(185, 200, 210, 0.06) 18%,
            rgba(205, 215, 220, 0.11) 50%,
            rgba(185, 200, 210, 0.06) 82%,
            transparent 100%
        );

    filter: blur(.25px);

    z-index: 34;

    pointer-events: none;
}


/* =========================================================
   Horizon — Light
========================================================= */

.scene[data-theme="light"] .horizon {

    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;

    height: 1px;

    /*
     * Darkと同じ「線」として存在させる。
     * ただしLightでは強くしすぎない。
     */
    background:
        linear-gradient(
            to right,
            transparent 0%,
            rgba(96, 128, 136, .035) 18%,
            rgba(84, 118, 126, .09) 50%,
            rgba(96, 128, 136, .035) 82%,
            transparent 100%
        );

    filter: blur(.3px);

    z-index: 34;

    pointer-events: none;
}


/* =========================================================
   Ocean — Dark
========================================================= */

.scene[data-theme="dark"] .ocean {

    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;
    bottom: 0;

    overflow: hidden;

    z-index: 5;

    background:
        linear-gradient(
            to bottom,
            rgba(25, 35, 42, 0.20) 0%,
            rgba(13, 21, 27, 0.32) 25%,
            rgba(8, 14, 19, 0.65) 70%,
            rgba(3, 7, 10, 0.95) 100%
        );
}


/* =========================================================
   Ocean — Light
========================================================= */

.scene[data-theme="light"] .ocean {

    position: absolute;

    inset: 37.5vh 0 0;

    z-index: 5;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(170,201,215,.08) 0%,
            rgba(158,193,209,.18) 20%,
            rgba(139,184,201,.30) 52%,
            rgba(120,172,192,.44) 100%
        );
}


/* =========================================================
   Dark Ocean Waves
========================================================= */

.scene[data-theme="dark"] .ocean::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 8%;

    width: 360px;
    height: 52px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.94);

    border-top: 1px solid rgba(180, 200, 210, .09);

    border-radius: 50%;

    filter: blur(1px);

    will-change: transform;

    animation:
        oceanWaveFar 8s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .ocean::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 17%;

    width: 520px;
    height: 72px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(1);

    border-top: 1px solid rgba(170, 190, 200, .075);

    border-radius: 50%;

    filter: blur(1.2px);

    will-change: transform;

    animation:
        oceanWaveMid 10s ease-in-out infinite alternate;
}


/* =========================================================
   Light Ocean Waves
========================================================= */

.scene[data-theme="light"] .ocean::before {

    content: "";

    position: absolute;

    inset: -8% -15% -5%;

    z-index: 6;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse 90px 4px at 10% 12%,
            rgba(255,255,255,.075) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 130px 4px at 45% 20%,
            rgba(255,255,255,.065) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 110px 4px at 82% 15%,
            rgba(255,255,255,.06) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 150px 5px at 25% 32%,
            rgba(255,255,255,.055) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 120px 4px at 68% 38%,
            rgba(255,255,255,.05) 0%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 170px 5px at 92% 48%,
            rgba(255,255,255,.045) 0%,
            rgba(255,255,255,0) 75%
        );

    background-size:
        420px 150px,
        510px 170px,
        460px 150px,
        560px 190px,
        500px 180px,
        620px 210px;

    background-position:
        0 0,
        0 25px,
        0 70px,
        0 110px,
        0 150px,
        0 200px;

    opacity: .65;

    will-change: transform;

    animation:
        distantWaves 13s ease-in-out infinite;
}

.scene[data-theme="light"] .ocean::after {

    content: "";

    position: absolute;

    inset: 5% -18% -8%;

    z-index: 7;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse 180px 7px at 8% 18%,
            rgba(255,255,255,.095) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 230px 7px at 38% 30%,
            rgba(255,255,255,.075) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 200px 7px at 70% 24%,
            rgba(255,255,255,.085) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 260px 8px at 94% 42%,
            rgba(255,255,255,.065) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 210px 7px at 20% 58%,
            rgba(255,255,255,.06) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 280px 8px at 58% 68%,
            rgba(255,255,255,.055) 0%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 230px 7px at 88% 82%,
            rgba(255,255,255,.05) 0%,
            rgba(255,255,255,0) 72%
        );

    background-size:
        520px 190px,
        650px 230px,
        580px 210px,
        700px 250px,
        560px 220px,
        720px 270px,
        620px 250px;

    background-position:
        0 0,
        80px 20px,
        -40px 80px,
        120px 120px,
        -80px 160px,
        60px 220px,
        -100px 280px;

    opacity: .72;

    will-change: transform;

    animation:
        nearWaves 8.5s ease-in-out infinite;
}


/* =========================================================
   Water Layers — Dark
========================================================= */

.scene[data-theme="dark"] .water,
.scene[data-theme="dark"] .surface-far,
.scene[data-theme="dark"] .surface-mid,
.scene[data-theme="dark"] .surface-near {

    position: absolute;

    pointer-events: none;

    will-change: transform;
}

.scene[data-theme="dark"] .water {
    left: 50%;
    top: 31%;

    width: 700px;
    height: 90px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.96);

    border-top: 1px solid rgba(170, 190, 200, .065);

    border-radius: 50%;

    filter: blur(1.5px);

    animation:
        oceanWaveNear 12s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-far {
    left: 50%;
    top: 43%;

    width: 860px;
    height: 100px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.96);

    border-top: 1px solid rgba(165, 185, 195, .055);

    border-radius: 50%;

    filter: blur(1.5px);

    animation:
        oceanSurfaceFar 14s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-mid {
    left: 50%;
    top: 58%;

    width: 1050px;
    height: 120px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(1);

    border-top: 1px solid rgba(155, 175, 185, .048);

    border-radius: 50%;

    filter: blur(2px);

    animation:
        oceanSurfaceMid 16s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-near {
    left: 50%;
    top: 75%;

    width: 1300px;
    height: 150px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.95);

    border-top: 1px solid rgba(145, 165, 175, .04);

    border-radius: 50%;

    filter: blur(2px);

    animation:
        oceanSurfaceNear 18s ease-in-out infinite alternate;
}


/* =========================================================
   Water Layers — Light
========================================================= */

.scene[data-theme="light"] .water,
.scene[data-theme="light"] .surface-far,
.scene[data-theme="light"] .surface-mid,
.scene[data-theme="light"] .surface-near {

    position: absolute;

    left: -12%;
    width: 124%;

    pointer-events: none;

    will-change: transform;
}

.scene[data-theme="light"] .water {
    top: 2%;
    height: 45%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 42% 8% at 18% 30%,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 38% 7% at 70% 48%,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 48% 8% at 42% 74%,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        waterDrift 17s ease-in-out infinite;
}

.scene[data-theme="light"] .surface-far {
    top: 7%;
    height: 34%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 34% 10% at 22% 35%,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,0) 70%
        ),
        radial-gradient(
            ellipse 30% 8% at 77% 65%,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        surfaceFar 21s ease-in-out infinite;
}

.scene[data-theme="light"] .surface-mid {
    top: 20%;
    height: 38%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 46% 9% at 8% 38%,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 40% 8% at 57% 28%,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,0) 72%
        ),
        radial-gradient(
            ellipse 44% 9% at 91% 67%,
            rgba(255,255,255,.11) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        surfaceMid 13s ease-in-out infinite;
}

.scene[data-theme="light"] .surface-near {
    top: 43%;
    height: 50%;

    z-index: 5;

    background:
        radial-gradient(
            ellipse 52% 11% at 24% 36%,
            rgba(255,255,255,.11) 0%,
            rgba(255,255,255,0) 70%
        ),
        radial-gradient(
            ellipse 46% 10% at 72% 58%,
            rgba(255,255,255,.09) 0%,
            rgba(255,255,255,0) 72%
        );

    animation:
        surfaceNear 16s ease-in-out infinite;
}


/* =========================================================
   Water Gaps — Dark
========================================================= */

.scene[data-theme="dark"] .water-gaps {

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at 30% 27%,
            rgba(190, 205, 210, .045) 0%,
            transparent 38%
        ),
        radial-gradient(
            ellipse at 72% 41%,
            rgba(185, 200, 210, .04) 0%,
            transparent 40%
        ),
        radial-gradient(
            ellipse at 42% 67%,

            transparent 45%

    opacity: .88;

    animation:

/* =========================================================
   Water Gaps — Light
========================================================= */

.scene[data-theme="light"] .water-gaps {

    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse 22% 4% at 18% 18%,
            rgba(255,255,255,.08),

        ),
        radial-gradient(
            ellipse 28% 5% at 76% 30%,
            rgba(255,255,255,.07),
            transparent 72%
        ),
        radial-gradient(
            ellipse 20% 4% at 42% 55%,
            rgba(255,255,255,.06),
            transparent 72%
        ),
        radial-gradient(
            ellipse 34% 6% at 83% 76%,
            rgba(255,255,255,.05),
            transparent 72%
        );

    animation:
        gapsDrift 14s ease-in-out infinite;
}


/* =========================================================
   Island Reflection — Dark
========================================================= */

.scene[data-theme="dark"] .island-shadow {

    position: absolute;

    left: 50%;
    top: calc(37.5vh + var(--reflection-offset));

    /*
     * 元の比率を維持。
     * ただし横方向は少し縮めて
     * 「真下に落ちている」感じを優先。
     */
    width: calc(var(--island-size) * .78);

    aspect-ratio: 108 / 48;
    height: auto;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(165, 185, 195, .075) 0%,
            rgba(135, 155, 165, .045) 25%,
            rgba(100, 120, 130, .022) 50%,
            rgba(70, 90, 100, .008) 70%,
            transparent 100%
        );

    filter: blur(4px);

    z-index: 31;

    animation:
        reflectionPulseDark 5.5s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .island-shadow::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 1px;

    width: calc(var(--island-size) * .66);

    aspect-ratio: 92 / 19;
    height: auto;

    transform: translateX(-50%);

    border-top: 1px solid rgba(190, 205, 210, .055);
    border-left: 1px solid rgba(180, 195, 205, .014);
    border-right: 1px solid rgba(180, 195, 205, .014);

    border-radius: 50%;

    filter: blur(.6px);

    animation:
        reflectionLineDark 6.5s ease-in-out infinite alternate;
}


/* =========================================================
   Island Reflection — Light
========================================================= */

.scene[data-theme="light"] .island-shadow {

    position: absolute;

    left: 50%;

    top:
        calc(
            37.5vh + var(--reflection-offset)
        );

    /*
     * 元の108:48を維持しながら、
     * 島の真下に小さく落とす。
     */
    width: calc(var(--island-size) * .72);

    aspect-ratio: 108 / 48;
    height: auto;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(48, 101, 106, .075) 0%,
            rgba(55, 108, 112, .045) 25%,
            rgba(67, 116, 120, .018) 50%,
            rgba(80, 125, 129, 0) 75%
        );

    filter: blur(4px);

    opacity: .72;

    z-index: 31;

    animation:
        reflectionPulseLight 7s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .island-shadow::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 1px;

    width: calc(var(--island-size) * .58);

    aspect-ratio: 92 / 19;
    height: auto;

    transform: translateX(-50%);

    border-top: 1px solid rgba(72, 119, 124, .045);
    border-left: 1px solid rgba(72, 119, 124, .012);
    border-right: 1px solid rgba(72, 119, 124, .012);

    border-radius: 50%;

    animation:

}

========================================================= */

/* =========================================================
   Theme Toggle
========================================================= */

.theme-toggle {
    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 100;

    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 10px;

    background: transparent;

        "Roboto Mono",
        "Menlo",
        monospace;

    font-size: 7px;
    line-height: 1;

    letter-spacing: .16em;

    cursor: pointer;

    appearance: none;

    transition:
        background .35s ease,
        border-color .35s ease,
        color .35s ease,
        opacity .35s ease;

        <div class="water-gaps"></div>

        <div class="ocean-mist"></div>

        <div class="water"></div>

        <div class="surface-far"></div>

        <div class="surface-mid"></div>

        <div class="surface-near"></div>

    <!-- =====================================================
         Brand

    <div class="brand">

        <h1 class="brand-name">

        </div>

<script>

/* =========================================================
   Theme Toggle
========================================================= */

(() => {

    const scene =
        document.querySelector(".scene");

    const toggle =
        document.querySelector(".theme-toggle");

    const icon =
        toggle.querySelector(".theme-toggle-icon");

    const label =
        toggle.querySelector(".theme-toggle-label");


    /* -------------------------------------------------------
       Saved Theme
    ------------------------------------------------------- */

    let savedTheme = null;

    try {
        savedTheme =
            localStorage.getItem("esenus-theme");
    } catch (error) {
        savedTheme = null;
    }


    if (
        savedTheme === "light" ||
        savedTheme === "dark"
    ) {
        scene.dataset.theme = savedTheme;
    }


    /* -------------------------------------------------------
       Update Toggle UI
    ------------------------------------------------------- */

    function updateToggle() {

        const isLight =
            scene.dataset.theme === "light";


        /*
         * ボタンには「現在のテーマ」ではなく
         * 「切り替え先」を表示。
         */

        if (isLight) {

            label.textContent = "DARK";
            icon.textContent = "◐";

            toggle.setAttribute(
                "aria-label",
                "ダークモードに切り替える"
            );

            toggle.setAttribute(
                "aria-pressed",
                "true"
            );

        } else {

            label.textContent = "LIGHT";
            icon.textContent = "○";

            toggle.setAttribute(
                "aria-label",
                "ライトモードに切り替える"
            );

            toggle.setAttribute(
                "aria-pressed",
                "false"
            );
        }
    }


    /* -------------------------------------------------------
       Toggle
    ------------------------------------------------------- */

    toggle.addEventListener("click", () => {

        const nextTheme =
            scene.dataset.theme === "dark"
                ? "light"
                : "dark";


        scene.dataset.theme =
            nextTheme;


        try {
            localStorage.setItem(
                "esenus-theme",
                nextTheme
            );
        } catch (error) {
            /* localStorage unavailable */
        }


        updateToggle();
    });


    /* -------------------------------------------------------
       Initial State
    ------------------------------------------------------- */

    updateToggle();

})();

</script>

</body>
</html>
