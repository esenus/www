<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark light">
<title>esenus</title>

<style>
/* =========================================================
   Shared Geometry
========================================================= */

:root {
    --island-size: clamp(100px, 18vw, 180px);
    --island-window-height: calc(var(--island-size) * .20);
    --island-horizon-gap: 4px;
    --reflection-offset: 1px;
}

/* =========================================================
   Base
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    min-height: 500px;
    overflow: hidden;
    isolation: isolate;
}

/* =========================================================
   DARK THEME
========================================================= */

.scene[data-theme="dark"] {
    --sky-top: #05070a;
    --sky-mid: #0b1016;
    --sky-bottom: #101820;

    --sea-top: #101920;
    --sea-mid: #0b1218;
    --sea-bottom: #05090d;

    --text: rgba(220,230,235,.72);

    --brand-color: rgba(220,230,235,.62);
    --status-color: rgba(220,230,235,.36);

    --link-color: rgba(220,230,235,.58);
    --link-hover: rgba(230,239,243,.94);
    --link-border: rgba(220,230,235,.13);
    --link-border-hover: rgba(220,230,235,.34);
    --link-surface: rgba(220,230,235,.025);
    --link-indicator: rgba(220,230,235,.34);
    --link-indicator-hover: rgba(220,230,235,.85);

    background: linear-gradient(
        to bottom,
        var(--sky-top) 0%,
        var(--sky-mid) 23%,
        var(--sky-bottom) 42%,
        var(--sea-top) 42%,
        var(--sea-mid) 70%,
        var(--sea-bottom) 100%
    );
}

/* =========================================================
   LIGHT THEME
========================================================= */

.scene[data-theme="light"] {
    --sky-top: #eaf2f5;
    --sky-mid: #e5eef2;
    --sky-bottom: #e0ebef;

    --sea-top: #dce9ee;
    --sea-mid: #cfe2e9;
    --sea-bottom: #bcd6df;

    --text: rgba(35,57,66,.48);

    --brand-color: rgba(35,57,66,.65);
    --status-color: rgba(35,57,66,.43);

    --link-color: rgba(35,57,66,.62);
    --link-hover: rgba(27,49,57,.96);
    --link-border: rgba(35,57,66,.14);
    --link-border-hover: rgba(35,57,66,.32);
    --link-surface: rgba(255,255,255,.20);
    --link-indicator: rgba(35,57,66,.34);
    --link-indicator-hover: rgba(35,57,66,.78);

    background: linear-gradient(
        180deg,
        #eaf2f5 0%,
        #e5eef2 27%,
        #e0ebef 48%,
        #dce9ee 100%
    );
}

/* =========================================================
   Atmosphere
========================================================= */

.atmosphere {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}

.scene[data-theme="dark"] .atmosphere {
    background: radial-gradient(
        ellipse at 50% 36%,
        rgba(150,175,190,.05) 0%,
        rgba(100,125,140,.025) 30%,
        transparent 65%
    );
}

.scene[data-theme="light"] .atmosphere {
    z-index: 1;
    background: radial-gradient(
        ellipse at 50% 38%,
        rgba(255,255,255,.56) 0%,
        rgba(255,255,255,.26) 27%,
        transparent 65%
    );
    animation: atmosphereBreath 12s ease-in-out infinite;
}

.scene[data-theme="dark"] .atmosphere::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 11% 18%, rgba(220,230,235,.38) 0 .7px, transparent 1.3px),
        radial-gradient(circle at 19% 31%, rgba(220,230,235,.22) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 27% 13%, rgba(220,230,235,.28) 0 .7px, transparent 1.3px),
        radial-gradient(circle at 34% 25%, rgba(220,230,235,.18) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 42% 9%, rgba(220,230,235,.30) 0 .7px, transparent 1.3px),
        radial-gradient(circle at 51% 20%, rgba(220,230,235,.20) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 59% 12%, rgba(220,230,235,.30) 0 .7px, transparent 1.3px),
        radial-gradient(circle at 67% 27%, rgba(220,230,235,.20) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 74% 15%, rgba(220,230,235,.32) 0 .7px, transparent 1.3px),
        radial-gradient(circle at 82% 24%, rgba(220,230,235,.20) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 91% 11%, rgba(220,230,235,.28) 0 .7px, transparent 1.3px),
        radial-gradient(circle at 87% 34%, rgba(220,230,235,.16) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 7% 37%, rgba(220,230,235,.18) 0 .6px, transparent 1.2px),
        radial-gradient(circle at 31% 36%, rgba(220,230,235,.15) 0 .6px, transparent 1.2px);
    opacity: .72;
    animation: starLight 11s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .atmosphere::after {
    content: "";
    position: absolute;
    inset: 30% 0 50%;
    background: radial-gradient(
        ellipse at center,
        rgba(190,210,220,.055),
        rgba(150,175,190,.025) 38%,
        transparent 75%
    );
    filter: blur(14px);
    animation: skyLight 17s ease-in-out infinite alternate;
}

/* =========================================================
   Island
========================================================= */

.island-window {
    position: absolute;
    left: 50%;
    top: calc(37.5vh - var(--island-window-height) - var(--island-horizon-gap));
    width: var(--island-size);
    height: var(--island-window-height);
    transform: translateX(-50%);
    overflow: hidden;
    z-index: 30;
    pointer-events: none;
}

.island {
    position: absolute;
    inset: 0 auto auto 0;
    width: var(--island-size);
    height: var(--island-size);
    border-radius: 50%;
    transform-origin: center;
}

.scene[data-theme="dark"] .island {
    background: radial-gradient(
        circle at 50% 42%,
        rgba(105,119,126,.30) 0%,
        rgba(76,88,95,.27) 28%,
        rgba(43,52,58,.24) 57%,
        rgba(18,24,28,.16) 76%,
        transparent 100%
    );
    filter: blur(1.8px);
    animation: islandDriftDark 9s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .island {
    background:
        radial-gradient(
            ellipse at 50% 32%,
            rgba(62,116,119,.16) 0%,
            rgba(57,108,112,.125) 24%,
            rgba(52,101,106,.09) 45%,
            rgba(49,96,101,.055) 63%,
            rgba(49,96,101,.018) 76%,
            transparent 88%
        ),
        radial-gradient(
            ellipse at 50% 72%,
            rgba(48,94,99,.055) 0%,
            rgba(48,94,99,.025) 42%,
            transparent 72%
        );
    filter: blur(1.05px) saturate(.78);
    opacity: .82;
    animation: islandDriftLight 14s ease-in-out infinite;
}

.scene[data-theme="light"] .island::before {
    content: "";
    position: absolute;
    left: 3%;
    right: 3%;
    top: 1%;
    height: 42%;
    border-radius: 50% 50% 35% 35% / 90% 90% 35% 35%;
    background: radial-gradient(
        ellipse at 50% 100%,
        rgba(48,98,103,.075),
        rgba(52,101,106,.05) 42%,
        rgba(70,115,119,.018) 68%,
        transparent 100%
    );
    filter: blur(1px);
    opacity: .78;
}

.scene[data-theme="light"] .island::after {
    content: "";
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 5px;
    height: 36%;
    border-radius: 50%;
    background: radial-gradient(
        ellipse at 50% 28%,
        rgba(220,239,241,.10),
        rgba(220,239,241,.045) 42%,
        transparent 82%
    );
    filter: blur(6px);
    opacity: .72;
}

/* =========================================================
   Island / Horizon Gap
========================================================= */

.island-gap-mist {
    position: absolute;
    left: 50%;
    top: calc(37.5vh - var(--island-horizon-gap));
    transform: translateX(-50%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 32;
}

.scene[data-theme="dark"] .island-gap-mist {
    width: calc(var(--island-size) * 1.28);
    height: 9px;
    background: radial-gradient(
        ellipse at center,
        rgba(190,205,210,.10),
        rgba(165,185,195,.045) 38%,
        transparent 75%
    );
    filter: blur(4px);
    animation: gapMistDark 9s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .island-gap-mist {
    width: calc(var(--island-size) * 1.02);
    height: 6px;
    background: radial-gradient(
        ellipse at center,
        rgba(225,239,241,.055),
        rgba(215,232,235,.018) 42%,
        transparent 76%
    );
    filter: blur(3px);
    opacity: .42;
    animation: gapMistLight 11s ease-in-out infinite alternate;
}

/* =========================================================
   Horizon
========================================================= */

.horizon {
    position: absolute;
    left: 0;
    right: 0;
    top: 37.5vh;
    height: 1px;
    pointer-events: none;
    z-index: 34;
}

.scene[data-theme="dark"] .horizon {
    background: linear-gradient(
        to right,
        transparent,
        rgba(185,200,210,.06) 18%,
        rgba(205,215,220,.11) 50%,
        rgba(185,200,210,.06) 82%,
        transparent
    );
    filter: blur(.25px);
}

.scene[data-theme="light"] .horizon {
    background: linear-gradient(
        to right,
        transparent,
        rgba(96,128,136,.035) 18%,
        rgba(84,118,126,.09) 50%,
        rgba(96,128,136,.035) 82%,
        transparent
    );
    filter: blur(.3px);
}

/* =========================================================
   Ocean
========================================================= */

.ocean {
    position: absolute;
    left: 0;
    right: 0;
    top: 37.5vh;
    bottom: 0;
    overflow: hidden;
    z-index: 5;
}

.scene[data-theme="dark"] .ocean {
    background: linear-gradient(
        to bottom,
        rgba(25,35,42,.20),
        rgba(13,21,27,.32) 25%,
        rgba(8,14,19,.65) 70%,
        rgba(3,7,10,.95)
    );
}

.scene[data-theme="light"] .ocean {
    background: linear-gradient(
        180deg,
        rgba(170,201,215,.08),
        rgba(158,193,209,.18) 20%,
        rgba(139,184,201,.30) 52%,
        rgba(120,172,192,.44)
    );
}

/* =========================================================
   Dark Ocean Waves
========================================================= */

.scene[data-theme="dark"] .ocean::before,
.scene[data-theme="dark"] .ocean::after {
    content: "";
    position: absolute;
    left: 50%;
    border-top: 1px solid rgba(180,200,210,.09);
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
}

.scene[data-theme="dark"] .ocean::before {
    top: 8%;
    width: 360px;
    height: 52px;
    filter: blur(1px);
    animation: oceanWaveFar 8s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .ocean::after {
    top: 17%;
    width: 520px;
    height: 72px;
    border-top-color: rgba(170,190,200,.075);
    filter: blur(1.2px);
    animation: oceanWaveMid 10s ease-in-out infinite alternate;
}

/* =========================================================
   Light Ocean Waves
========================================================= */

.scene[data-theme="light"] .ocean::before {
    content: "";
    position: absolute;
    inset: -8% -15% -5%;
    z-index: 6;
    pointer-events: none;
    background:
        radial-gradient(ellipse 90px 4px at 10% 12%, rgba(255,255,255,.075), transparent 75%),
        radial-gradient(ellipse 130px 4px at 45% 20%, rgba(255,255,255,.065), transparent 75%),
        radial-gradient(ellipse 110px 4px at 82% 15%, rgba(255,255,255,.06), transparent 75%),
        radial-gradient(ellipse 150px 5px at 25% 32%, rgba(255,255,255,.055), transparent 75%),
        radial-gradient(ellipse 120px 4px at 68% 38%, rgba(255,255,255,.05), transparent 75%),
        radial-gradient(ellipse 170px 5px at 92% 48%, rgba(255,255,255,.045), transparent 75%);
    background-size:
        420px 150px,
        510px 170px,
        460px 150px,
        560px 190px,
        500px 180px,
        620px 210px;
    background-position:
        0 0,
        0 25px,
        0 70px,
        0 110px,
        0 150px,
        0 200px;
    opacity: .65;
    animation: distantWaves 13s ease-in-out infinite;
}

.scene[data-theme="light"] .ocean::after {
    content: "";
    position: absolute;
    inset: 5% -18% -8%;
    z-index: 7;
    pointer-events: none;
    background:
        radial-gradient(ellipse 180px 7px at 8% 18%, rgba(255,255,255,.095), transparent 72%),
        radial-gradient(ellipse 230px 7px at 38% 30%, rgba(255,255,255,.075), transparent 72%),
        radial-gradient(ellipse 200px 7px at 70% 24%, rgba(255,255,255,.085), transparent 72%),
        radial-gradient(ellipse 260px 8px at 94% 42%, rgba(255,255,255,.065), transparent 72%),
        radial-gradient(ellipse 210px 7px at 20% 58%, rgba(255,255,255,.06), transparent 72%),
        radial-gradient(ellipse 280px 8px at 58% 68%, rgba(255,255,255,.055), transparent 72%),
        radial-gradient(ellipse 230px 7px at 88% 82%, rgba(255,255,255,.05), transparent 72%);
    background-size:
        520px 190px,
        650px 230px,
        580px 210px,
        700px 250px,
        560px 220px,
        720px 270px,
        620px 250px;
    background-position:
        0 0,
        80px 20px,
        -40px 80px,
        120px 120px,
        -80px 160px,
        60px 220px,
        -100px 280px;
    opacity: .72;
    animation: nearWaves 8.5s ease-in-out infinite;
}

/* =========================================================
   Water Layers — Dark
========================================================= */

.scene[data-theme="dark"] .water,
.scene[data-theme="dark"] .surface-far,
.scene[data-theme="dark"] .surface-mid,
.scene[data-theme="dark"] .surface-near {
    position: absolute;
    left: 50%;
    border-top: 1px solid rgba(170,190,200,.065);
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
}

.scene[data-theme="dark"] .water {
    top: 31%;
    width: 700px;
    height: 90px;
    filter: blur(1.5px);
    animation: oceanWaveNear 12s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-far {
    top: 43%;
    width: 860px;
    height: 100px;
    border-top-color: rgba(165,185,195,.055);
    filter: blur(1.5px);
    animation: oceanSurfaceFar 14s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-mid {
    top: 58%;
    width: 1050px;
    height: 120px;
    border-top-color: rgba(155,175,185,.048);
    filter: blur(2px);
    animation: oceanSurfaceMid 16s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .surface-near {
    top: 75%;
    width: 1300px;
    height: 150px;
    border-top-color: rgba(145,165,175,.04);
    filter: blur(2px);
    animation: oceanSurfaceNear 18s ease-in-out infinite alternate;
}

/* =========================================================
   Water Layers — Light
========================================================= */

.scene[data-theme="light"] .water,
.scene[data-theme="light"] .surface-far,
.scene[data-theme="light"] .surface-mid,
.scene[data-theme="light"] .surface-near {
    position: absolute;
    left: -12%;
    width: 124%;
    pointer-events: none;
    will-change: transform;
    z-index: 5;
}

.scene[data-theme="light"] .water {
    top: 2%;
    height: 45%;
    background:
        radial-gradient(ellipse 42% 8% at 18% 30%, rgba(255,255,255,.18), transparent 72%),
        radial-gradient(ellipse 38% 7% at 70% 48%, rgba(255,255,255,.13), transparent 72%),
        radial-gradient(ellipse 48% 8% at 42% 74%, rgba(255,255,255,.10), transparent 72%);
    animation: waterDrift 17s ease-in-out infinite;
}

.scene[data-theme="light"] .surface-far {
    top: 7%;
    height: 34%;
    background:
        radial-gradient(ellipse 34% 10% at 22% 35%, rgba(255,255,255,.13), transparent 70%),
        radial-gradient(ellipse 30% 8% at 77% 65%, rgba(255,255,255,.10), transparent 72%);
    animation: surfaceFar 21s ease-in-out infinite;
}

.scene[data-theme="light"] .surface-mid {
    top: 20%;
    height: 38%;
    background:
        radial-gradient(ellipse 46% 9% at 8% 38%, rgba(255,255,255,.13), transparent 72%),
        radial-gradient(ellipse 40% 8% at 57% 28%, rgba(255,255,255,.10), transparent 72%),
        radial-gradient(ellipse 44% 9% at 91% 67%, rgba(255,255,255,.11), transparent 72%);
    animation: surfaceMid 13s ease-in-out infinite;
}

.scene[data-theme="light"] .surface-near {
    top: 43%;
    height: 50%;
    background:
        radial-gradient(ellipse 52% 11% at 24% 36%, rgba(255,255,255,.11), transparent 70%),
        radial-gradient(ellipse 46% 10% at 72% 58%, rgba(255,255,255,.09), transparent 72%);
    animation: surfaceNear 16s ease-in-out infinite;
}

/* =========================================================
   Water Gaps
========================================================= */

.water-gaps {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.scene[data-theme="dark"] .water-gaps {
    background:
        radial-gradient(ellipse at 30% 27%, rgba(190,205,210,.045), transparent 38%),
        radial-gradient(ellipse at 72% 41%, rgba(185,200,210,.04), transparent 40%),
        radial-gradient(ellipse at 42% 67%, rgba(170,190,200,.035), transparent 45%);
    opacity: .88;
    animation: waterAtmosphere 13s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .water-gaps {
    z-index: 8;
    background:
        radial-gradient(ellipse 22% 4% at 18% 18%, rgba(255,255,255,.08), transparent 72%),
        radial-gradient(ellipse 28% 5% at 76% 30%, rgba(255,255,255,.07), transparent 72%),
        radial-gradient(ellipse 20% 4% at 42% 55%, rgba(255,255,255,.06), transparent 72%),
        radial-gradient(ellipse 34% 6% at 83% 76%, rgba(255,255,255,.05), transparent 72%);
    animation: gapsDrift 14s ease-in-out infinite;
}

/* =========================================================
   Island Reflection
========================================================= */

.island-shadow {
    position: absolute;
    left: 50%;
    top: calc(37.5vh + var(--reflection-offset));
    transform: translateX(-50%);
    border-radius: 50%;
    z-index: 31;
    pointer-events: none;
}

.scene[data-theme="dark"] .island-shadow {
    width: calc(var(--island-size) * .78);
    aspect-ratio: 108 / 48;
    background: radial-gradient(
        ellipse at center,
        rgba(165,185,195,.075),
        rgba(135,155,165,.045) 25%,
        rgba(100,120,130,.022) 50%,
        rgba(70,90,100,.008) 70%,
        transparent
    );
    filter: blur(4px);
    animation: reflectionPulseDark 5.5s ease-in-out infinite alternate;
}

.scene[data-theme="dark"] .island-shadow::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 1px;
    width: calc(var(--island-size) * .66);
    aspect-ratio: 92 / 19;
    transform: translateX(-50%);
    border-top: 1px solid rgba(190,205,210,.055);
    border-left: 1px solid rgba(180,195,205,.014);
    border-right: 1px solid rgba(180,195,205,.014);
    border-radius: 50%;
    filter: blur(.6px);
    animation: reflectionLineDark 6.5s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .island-shadow {
    width: calc(var(--island-size) * .72);
    aspect-ratio: 108 / 48;
    background: radial-gradient(
        ellipse at center top,
        rgba(48,101,106,.075),
        rgba(55,108,112,.045) 25%,
        rgba(67,116,120,.018) 50%,
        transparent 75%
    );
    filter: blur(4px);
    opacity: .72;
    animation: reflectionPulseLight 7s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .island-shadow::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 1px;
    width: calc(var(--island-size) * .58);
    aspect-ratio: 92 / 19;
    transform: translateX(-50%);
    border-top: 1px solid rgba(72,119,124,.045);
    border-left: 1px solid rgba(72,119,124,.012);
    border-right: 1px solid rgba(72,119,124,.012);
    border-radius: 50%;
    filter: blur(.65px);
    animation: reflectionLineLight 7s ease-in-out infinite alternate;
}

/* =========================================================
   Ocean Mist
========================================================= */

.ocean-mist {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    pointer-events: none;
}

.scene[data-theme="dark"] .ocean-mist {
    height: 35%;
    background: linear-gradient(
        to bottom,
        rgba(175,195,205,.045),
        rgba(150,175,185,.018) 40%,
        transparent
    );
    filter: blur(7px);
    z-index: 20;
    animation: oceanMist 15s ease-in-out infinite alternate;
}

.scene[data-theme="light"] .ocean-mist {
    inset: 36vh 0 auto;
    height: 12vh;
    z-index: 12;
    background: linear-gradient(
        180deg,
        rgba(239,246,248,.18),
        transparent
    );
    filter: blur(7px);
    opacity: .48;
}

/* =========================================================
   Brand Area
========================================================= */

.brand {
    position: absolute;
    left: 50%;
    bottom: 5.5vh;
    z-index: 50;
    transform: translateX(-50%);

    display: flex;
    flex-direction: column;
    align-items: center;

    width: max-content;
    max-width: calc(100% - 32px);

    text-align: center;
    user-select: none;
}

/* Brand name */

.brand-name {
    margin: 0;
    font-size: clamp(18px, 1.5vw, 21px);
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: .24em;
    text-indent: .24em;
    color: var(--brand-color);
}

/* Status */

.brand-status {
    margin-top: 7px;
    font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        monospace;
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: .12em;
    text-indent: .12em;
    text-transform: lowercase;
    white-space: nowrap;
    color: var(--status-color);
}

.status-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    margin-right: 7px;
    border-radius: 50%;
    vertical-align: 2px;
    background: currentColor;
    animation: statusPulse 3.2s ease-in-out infinite;
}

/* =========================================================
   Project Navigation
   Quiet entry points, not an in-page control panel
========================================================= */

.project-nav {
    display: flex;
    align-items: stretch;
    justify-content: center;

    width: 100%;
    margin-top: 25px;
    gap: clamp(10px, 2.2vw, 22px);
}

/*
   Each link is a small, independent destination.
   The frame remains nearly invisible until interaction.
*/

.project-link {
    --link-progress: 0%;

    position: relative;
    isolation: isolate;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 88px;
    min-height: 48px;
    padding: 13px 16px;

    border: 1px solid var(--link-border);
    border-radius: 2px;

    color: var(--link-color);
    background: transparent;

    font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        monospace;

    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: .19em;
    text-indent: .19em;
    text-decoration: none;
    text-transform: lowercase;

    transition:
        color .35s ease,
        border-color .35s ease,
        background-color .35s ease,
        transform .35s ease;
}

/* A faint surface, revealed only on interaction */

.project-link::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;

    background: var(--link-surface);
    opacity: 0;

    transition: opacity .35s ease;
}

/* Fine line that grows from the center */

.project-link::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -1px;

    width: var(--link-progress);
    height: 1px;

    background: var(--link-indicator-hover);
    transform: translateX(-50%);

    transition:
        width .38s cubic-bezier(.2,.7,.2,1),
        background-color .35s ease;
}

/* Small marker above the label */

.project-link-marker {
    position: absolute;
    top: 7px;
    left: 8px;

    width: 3px;
    height: 3px;
    border-radius: 50%;

    background: var(--link-indicator);
    opacity: .8;

    transition:
        background-color .35s ease,
        opacity .35s ease,
        box-shadow .35s ease;
}

.project-link:hover,
.project-link:focus-visible {
    color: var(--link-hover);
    border-color: var(--link-border-hover);
    background-color: transparent;
    outline: none;
}

.project-link:hover {
    --link-progress: 34%;
}

.project-link:hover::before,
.project-link:focus-visible::before {
    opacity: 1;
}

.project-link:focus-visible {
    outline: 1px solid var(--link-border-hover);
    outline-offset: 4px;
}

.project-link:focus-visible::after {
    width: 34%;
}

.project-link:hover .project-link-marker,
.project-link:focus-visible .project-link-marker {
    background: var(--link-indicator-hover);
    opacity: 1;
    box-shadow: 0 0 7px var(--link-indicator);
}

/* A little separation without drawing attention */

.project-link + .project-link {
    margin-left: 0;
}

/* =========================================================
   Theme Toggle
========================================================= */

.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    min-height: 36px;
    padding: 8px 12px;

    border: 1px solid var(--link-border);
    border-radius: 999px;
    background: transparent;
    color: var(--link-color);

    font-family:
        "SFMono-Regular",
        "Roboto Mono",
        "Menlo",
        monospace;

    font-size: 10px;
    line-height: 1;
    letter-spacing: .12em;

    cursor: pointer;
    appearance: none;

    transition:
        background .35s ease,
        border-color .35s ease,
        color .35s ease;
}

.scene[data-theme="dark"] .theme-toggle {
    background: rgba(5,7,10,.22);
}

.scene[data-theme="light"] .theme-toggle {
    background: rgba(255,255,255,.18);
}

.theme-toggle:hover {
    color: var(--link-hover);
    border-color: var(--link-border-hover);
}

.theme-toggle:focus-visible {
    outline: 1px solid var(--link-border-hover);
    outline-offset: 3px;
}

.theme-toggle-icon {
    font-size: 12px;
    line-height: 1;
}

.theme-toggle-label {

}

<script>
/* =========================================================
   Theme Toggle
========================================================= */

(() => {
    const scene = document.querySelector(".scene");
    const toggle = document.querySelector(".theme-toggle");
    const icon = toggle.querySelector(".theme-toggle-icon");
    const label = toggle.querySelector(".theme-toggle-label");

    let savedTheme = null;

    try {
        savedTheme = localStorage.getItem("esenus-theme");
    } catch (error) {
        savedTheme = null;
    }

    if (savedTheme === "light" || savedTheme === "dark") {
        scene.dataset.theme = savedTheme;
    }

    function updateToggle() {
        const isLight = scene.dataset.theme === "light";

        label.textContent = isLight ? "DARK" : "LIGHT";
        icon.textContent = isLight ? "◐" : "○";

        toggle.setAttribute(
            "aria-label",
            isLight
                ? "ダークモードに切り替える"
                : "ライトモードに切り替える"
        );

        toggle.setAttribute(
            "aria-pressed",
            String(isLight)
        );

        document.querySelector('meta[name="theme-color"]')
            .setAttribute(
                "content",
                isLight ? "#eaf2f5" : "#05070a"
            );
    }

    toggle.addEventListener("click", () => {
        const nextTheme =
            scene.dataset.theme === "dark" ? "light" : "dark";

        scene.dataset.theme = nextTheme;

        try {
            localStorage.setItem("esenus-theme", nextTheme);
        } catch (error) {
            /* localStorage unavailable */
        }

        updateToggle();
    });

    updateToggle();
})();
</script>
