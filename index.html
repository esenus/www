<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>esenus</title>

<style>

/* =========================================================
   Shared Variables
========================================================= */

:root {

    /*
     * Island geometry
     * -----------------------------------------------
     * Both themes use exactly the same geometry.
     */

    --island-size: clamp(100px, 18vw, 180px);

    --island-window-height:
        calc(var(--island-size) * 0.20);

    /*
     * Visible island → horizon
     *
     * Actual physical gap:
     * 4px
     */
    --island-horizon-gap: 4px;

    /*
     * Reflection begins almost immediately
     * below the horizon.
     */
    --reflection-offset: 1px;

}


/* =========================================================
   Reset
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;
}


/* =========================================================
   Theme Variables
========================================================= */

.scene {

    /*
     * Dark is the default.
     */

    --sky-top: #05070a;
    --sky-mid: #0b1016;
    --sky-bottom: #101820;

    --sea-top: #101920;
    --sea-mid: #0b1218;
    --sea-bottom: #05090d;

    --text-main:
        rgba(220, 230, 235, 0.72);

    --text-sub:
        rgba(220, 230, 235, 0.27);

    --button-bg:
        rgba(255,255,255,0.045);

    --button-border:
        rgba(220,230,235,0.12);

    --button-text:
        rgba(220,230,235,0.55);

    /*
     * Dark island
     */
    --island-main:
        rgba(105,119,126,0.30);

    --island-mid:
        rgba(76,88,95,0.27);

    --island-low:
        rgba(43,52,58,0.24);

    --island-bottom:
        rgba(18,24,28,0.16);

    --island-atmosphere:
        rgba(125,140,148,0.13);

    /*
     * Dark reflection
     */
    --reflection-main:
        rgba(165,185,195,0.105);

    --reflection-mid:
        rgba(135,155,165,0.065);

    --reflection-low:
        rgba(100,120,130,0.035);

    --reflection-line:
        rgba(190,205,210,0.075);

}


/* =========================================================
   Light Theme
========================================================= */

.scene.light {

    --sky-top: #eaf2f5;
    --sky-mid: #e5eef2;
    --sky-bottom: #e0ebef;

    --sea-top: #d8e7ec;
    --sea-mid: #c8dce3;
    --sea-bottom: #c1d6de;

    --text-main:
        rgba(55,79,87,0.62);

    --text-sub:
        rgba(66,87,94,0.48);

    --button-bg:
        rgba(255,255,255,0.28);

    --button-border:
        rgba(55,79,87,0.12);

    --button-text:
        rgba(55,79,87,0.58);

    /*
     * LIGHT ISLAND
     *
     * Considerably weaker than the previous light version.
     *
     * Blue-green rather than gray.
     */
    --island-main:
        rgba(67,112,117,0.115);

    --island-mid:
        rgba(62,106,112,0.095);

    --island-low:
        rgba(57,101,107,0.070);

    --island-bottom:
        rgba(53,95,101,0.035);

    --island-atmosphere:
        rgba(70,119,123,0.045);

    /*
     * Very subtle reflection.
     *
     * It should be visible only enough to communicate:
     * "the island is reflected in the water."
     */
    --reflection-main:
        rgba(63,111,117,0.085);

    --reflection-mid:
        rgba(63,111,117,0.050);

    --reflection-low:
        rgba(63,111,117,0.020);

    --reflection-line:
        rgba(72,119,124,0.050);

}


/* =========================================================
   Scene
========================================================= */

.scene {

    position: relative;

    width: 100%;
    height: 100svh;
    min-height: 520px;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,

            var(--sky-top) 0%,
            var(--sky-mid) 23%,
            var(--sky-bottom) 42%,

            var(--sea-top) 42%,
            var(--sea-mid) 70%,
            var(--sea-bottom) 100%
        );

    transition:
        background 700ms ease;
}


/* =========================================================
   Theme Toggle
========================================================= */

.theme-toggle {

    position: absolute;

    top: 18px;
    right: 18px;

    z-index: 100;

    width: 30px;
    height: 30px;

    padding: 0;

    border:
        1px solid
        var(--button-border);

    border-radius: 50%;

    background:
        var(--button-bg);

    color:
        var(--button-text);

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    transition:
        background 400ms ease,
        border-color 400ms ease,
        color 400ms ease,
        transform 200ms ease;

    appearance: none;
}

.theme-toggle:hover {
    transform: scale(1.06);
}

.theme-toggle:active {
    transform: scale(.96);
}

.theme-toggle:focus-visible {

    outline:
        1px solid
        var(--button-text);

    outline-offset: 3px;
}


/*
 * Simple sun / moon symbol.
 *
 * No emoji is used so appearance remains stable
 * between operating systems.
 */

.theme-icon {

    position: relative;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    border:
        1px solid
        currentColor;

    opacity: .72;

    transition:
        transform 500ms ease,
        opacity 400ms ease;
}


/*
 * Dark mode:
 * moon-like crescent.
 */

.scene:not(.light) .theme-icon {

    background:
        transparent;

    box-shadow:
        3px -2px 0 -1px
        var(--sky-top);

    transform:
        rotate(-20deg);
}


/*
 * Light mode:
 * sun-like circle.
 */

.scene.light .theme-icon {

    background:
        currentColor;

    box-shadow:
        0 -6px 0 -4px currentColor,
        0 6px 0 -4px currentColor,
        6px 0 0 -4px currentColor,
        -6px 0 0 -4px currentColor,
        4px 4px 0 -4px currentColor,
        -4px -4px 0 -4px currentColor,
        4px -4px 0 -4px currentColor,
        -4px 4px 0 -4px currentColor;

    transform:
        rotate(0deg);
}


/* =========================================================
   Atmosphere
========================================================= */

.atmosphere {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 36%,
            rgba(150,175,190,.05) 0%,
            rgba(100,125,140,.025) 30%,
            transparent 65%
        );
}


/* =========================================================
   Dark Stars
========================================================= */

.scene:not(.light) .atmosphere::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 11% 18%,
            rgba(220,230,235,.38) 0 .7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle at 19% 31%,
            rgba(220,230,235,.22) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 27% 13%,
            rgba(220,230,235,.28) 0 .7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle at 34% 25%,
            rgba(220,230,235,.18) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 42% 9%,
            rgba(220,230,235,.30) 0 .7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle at 51% 20%,
            rgba(220,230,235,.20) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 59% 12%,
            rgba(220,230,235,.30) 0 .7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle at 67% 27%,
            rgba(220,230,235,.20) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 74% 15%,
            rgba(220,230,235,.32) 0 .7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle at 82% 24%,
            rgba(220,230,235,.20) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 91% 11%,
            rgba(220,230,235,.28) 0 .7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle at 87% 34%,
            rgba(220,230,235,.16) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 7% 37%,
            rgba(220,230,235,.18) 0 .6px,
            transparent 1.2px
        ),

        radial-gradient(
            circle at 31% 36%,
            rgba(220,230,235,.15) 0 .6px,
            transparent 1.2px
        );

    opacity: .72;

    animation:
        starLight 11s ease-in-out infinite alternate;
}


/* =========================================================
   Light Atmosphere
========================================================= */

.scene.light .atmosphere {

    background:
        radial-gradient(
            ellipse at 50% 34%,
            rgba(255,255,255,.48) 0%,
            rgba(255,255,255,.22) 18%,
            rgba(255,255,255,0) 46%
        );

    opacity: .8;

    animation:
        atmosphereBreath 14s ease-in-out infinite;
}

.scene.light .atmosphere::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at 50% 39%,
            rgba(255,255,255,.22) 0%,
            rgba(255,255,255,.08) 18%,
            rgba(255,255,255,0) 42%
        );

    opacity: .55;

    animation:
        atmosphereShift 18s ease-in-out infinite;
}


/* =========================================================
   Dark Sky Light
========================================================= */

.scene:not(.light) .atmosphere::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 30%;
    height: 20%;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(190,210,220,.055) 0%,
            rgba(150,175,190,.025) 38%,
            transparent 75%
        );

    filter: blur(14px);

    animation:
        skyLight 17s ease-in-out infinite alternate;
}


/* =========================================================
   Island Window
========================================================= */

.island-window {

    position: absolute;

    left: 50%;

    /*
     * The visible island ends exactly
     * 4px above the horizon.
     */
    top:
        calc(
            37.5vh
            - var(--island-window-height)
            - var(--island-horizon-gap)
        );

    width:
        var(--island-size);

    height:
        var(--island-window-height);

    transform:
        translateX(-50%);

    overflow: hidden;

    z-index: 30;

    pointer-events: none;
}


/* =========================================================
   Island
========================================================= */

.island {

    position: absolute;

    left: 0;
    top: 0;

    width:
        var(--island-size);

    height:
        var(--island-size);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 42%,
            var(--island-main) 0%,
            var(--island-mid) 28%,
            var(--island-low) 57%,
            var(--island-bottom) 76%,
            rgba(10,14,17,0) 100%
        );

    filter:
        blur(1.8px);

    transform-origin:
        center center;

    animation:
        islandDrift
        9s ease-in-out infinite alternate;

    transition:
        opacity 600ms ease,
        filter 600ms ease;
}


/*
 * Dark mode island is the original strength.
 */

.scene:not(.light) .island {
    opacity: 1;
}


/*
 * Light mode:
 * considerably weaker.
 */
.scene.light .island {

    opacity: .92;

    filter:
        blur(1.15px)
        saturate(.82);
}


/* =========================================================
   Island Upper Atmosphere
========================================================= */

.island::before {

    content: "";

    position: absolute;

    left: 3%;
    right: 3%;

    top: 1%;

    height: 42%;

    border-radius:
        50% 50% 35% 35% /
        90% 90% 35% 35%;

    background:
        radial-gradient(
            ellipse at 50% 100%,
            var(--island-atmosphere) 0%,
            rgba(92,108,116,.085) 42%,
            rgba(65,80,88,.03) 68%,
            transparent 100%
        );

    filter:
        blur(.8px);

    opacity: .8;
}


/*
 * Light mode upper atmosphere is weaker.
 */

.scene.light .island::before {

    opacity: .42;

    background:
        radial-gradient(
            ellipse at 50% 100%,
            rgba(70,119,123,.055) 0%,
            rgba(70,119,123,.028) 42%,
            rgba(70,119,123,0) 70%
        );
}


/* =========================================================
   Island Lower Haze
========================================================= */

.island::after {

    content: "";

    position: absolute;

    left: -8%;
    right: -8%;

    bottom: 8px;

    height: 34%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(180,195,202,.055) 0%,
            rgba(150,170,180,.025) 42%,
            transparent 82%
        );

    filter:
        blur(5px);

    opacity: .72;
}


/*
 * Very restrained in light mode.
 */

.scene.light .island::after {

    background:
        radial-gradient(
            ellipse at center,
            rgba(220,238,239,.08) 0%,
            rgba(220,238,239,.025) 42%,
            rgba(220,238,239,0) 80%
        );

    opacity: .45;
}


/* =========================================================
   Gap Mist
========================================================= */

.island-gap-mist {

    position: absolute;

    left: 50%;

    /*
     * Centered inside the 4px visual gap.
     *
     * The actual geometry remains 4px.
     * This layer is intentionally very subtle.
     */
    top:
        calc(
            37.5vh
            - var(--island-horizon-gap)
        );

    width:
        clamp(112px, 20vw, 200px);

    height: 6px;

    transform:
        translateX(-50%);

    z-index: 32;

    pointer-events: none;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(190,205,210,.08) 0%,
            rgba(165,185,195,.025) 42%,
            transparent 75%
        );

    filter:
        blur(3px);

    opacity: .32;

    animation:
        gapMist 9s ease-in-out infinite alternate;
}


/*
 * Light gap mist is particularly restrained.
 *
 * This is important because a bright mist inside
 * the 4px gap can make the gap look much larger.
 */

.scene.light .island-gap-mist {

    width:
        clamp(100px, 18vw, 180px);

    height: 5px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.12) 0%,
            rgba(244,249,250,.045) 36%,
            rgba(244,249,250,0) 74%
        );

    opacity: .28;

    filter:
        blur(2.5px);
}


/* =========================================================
   Horizon
========================================================= */

.horizon {

    position: absolute;

    left: -10%;
    right: -10%;

    top: 37.5vh;

    height: 1px;

    z-index: 34;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            transparent 0%,
            rgba(185,200,210,.06) 18%,
            rgba(205,215,220,.11) 50%,
            rgba(185,200,210,.06) 82%,
            transparent 100%
        );

    filter:
        blur(.25px);
}


/* =========================================================
   Light Horizon
========================================================= */

.scene.light .horizon {

    left: 0;
    right: 0;

    background:
        linear-gradient(
            to right,
            rgba(255,255,255,0) 0%,
            rgba(255,255,255,.38) 20%,
            rgba(255,255,255,.68) 50%,
            rgba(255,255,255,.38) 80%,
            rgba(255,255,255,0) 100%
        );

    opacity: .72;

    animation:
        horizonPulse 10s ease-in-out infinite;
}


/* =========================================================
   Ocean
========================================================= */

.ocean {

    position: absolute;

    left: 0;
    right: 0;

    top: 37.5vh;
    bottom: 0;

    overflow: hidden;

    z-index: 5;

    background:
        linear-gradient(
            to bottom,

            var(--sea-top) 0%,
            var(--sea-mid) 70%,
            var(--sea-bottom) 100%
        );
}


/* =========================================================
   Dark Ocean Far
========================================================= */

.scene:not(.light) .ocean::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 8%;

    width: 360px;
    height: 52px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.94);

    border-top:
        1px solid
        rgba(180,200,210,.09);

    border-radius: 50%;

    filter:
        blur(1px);

    will-change:
        transform;

    animation:
        oceanWaveFar
        8s ease-in-out infinite alternate;
}


/* =========================================================
   Dark Ocean Middle
========================================================= */

.scene:not(.light) .ocean::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 17%;

    width: 520px;
    height: 72px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(1);

    border-top:
        1px solid
        rgba(170,190,200,.075);

    border-radius: 50%;

    filter:
        blur(1.2px);

    will-change:
        transform;

    animation:
        oceanWaveMid
        10s ease-in-out infinite alternate;
}


/* =========================================================
   Dark Ocean Layers
========================================================= */

.scene:not(.light) .water {

    position: absolute;

    left: 50%;
    top: 31%;

    width: 700px;
    height: 90px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.96);

    border-top:
        1px solid
        rgba(170,190,200,.065);

    border-radius: 50%;

    filter:
        blur(1.5px);

    will-change:
        transform;

    animation:
        oceanWaveNear
        12s ease-in-out infinite alternate;
}

.scene:not(.light) .surface-far {

    position: absolute;

    left: 50%;
    top: 43%;

    width: 860px;
    height: 100px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.96);

    border-top:
        1px solid
        rgba(165,185,195,.055);

    border-radius: 50%;

    filter:
        blur(1.5px);

    will-change:
        transform;

    animation:
        oceanSurfaceFar
        14s ease-in-out infinite alternate;
}

.scene:not(.light) .surface-mid {

    position: absolute;

    left: 50%;
    top: 58%;

    width: 1050px;
    height: 120px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(1);

    border-top:
        1px solid
        rgba(155,175,185,.048);

    border-radius: 50%;

    filter:
        blur(2px);

    will-change:
        transform;

    animation:
        oceanSurfaceMid
        16s ease-in-out infinite alternate;
}

.scene:not(.light) .surface-near {

    position: absolute;

    left: 50%;
    top: 75%;

    width: 1300px;
    height: 150px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleX(.95);

    border-top:
        1px solid
        rgba(145,165,175,.04);

    border-radius: 50%;

    filter:
        blur(2px);

    will-change:
        transform;

    animation:
        oceanSurfaceNear
        18s ease-in-out infinite alternate;
}


/* =========================================================
   Light Ocean
========================================================= */

.scene.light .ocean {

    background:
        linear-gradient(
            to bottom,
            #d8e7ec 0%,
            #d1e2e8 30%,
            #c8dce3 65%,
            #c1d6de 100%
        );
}

.scene.light .ocean::before {

    content: "";

    position: absolute;

    inset: -8% -10%;

    background:
        radial-gradient(
            ellipse at 18% 16%,
            rgba(255,255,255,.26) 0%,
            rgba(255,255,255,0) 28%
        ),
        radial-gradient(
            ellipse at 72% 30%,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,0) 31%
        ),
        radial-gradient(
            ellipse at 42% 72%,
            rgba(255,255,255,.12) 0%,
            rgba(255,255,255,0) 34%
        );

    filter:
        blur(8px);

    opacity: .7;

    animation:
        oceanAtmosphere
        18s ease-in-out infinite;
}

.scene.light .ocean::after {

    content: "";

    position: absolute;

    left: -10%;
    right: -10%;

    top: 0;
    height: 46%;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(255,255,255,.32) 0%,
            rgba(255,255,255,.10) 32%,
            rgba(255,255,255,0) 70%
        );

    filter:
        blur(5px);

    opacity: .7;

    animation:
        oceanGlow
        13s ease-in-out infinite;
}


/* =========================================================
   Light Water
========================================================= */

.scene.light .water {

    position: absolute;

    left: -12%;
    right: -12%;

    top: 0;
    bottom: 0;

    background:

        radial-gradient(
            ellipse 42% 5% at 12% 13%,
            rgba(255,255,255,.38) 0%,
            rgba(255,255,255,.16) 35%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 34% 4% at 38% 22%,
            rgba(255,255,255,.28) 0%,
            rgba(255,255,255,.10) 38%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 48% 5% at 72% 15%,
            rgba(255,255,255,.30) 0%,
            rgba(255,255,255,.10) 38%,
            rgba(255,255,255,0) 75%
        ),

        radial-gradient(
            ellipse 42% 5% at 88% 36%,
            rgba(255,255,255,.24) 0%,
            rgba(255,255,255,.08) 38%,
            rgba(255,255,255,0) 74%
        ),

        radial-gradient(
            ellipse 48% 6% at 24% 50%,
            rgba(255,255,255,.22) 0%,
            rgba(255,255,255,.08) 36%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 52% 6% at 67% 60%,
            rgba(255,255,255,.22) 0%,
            rgba(255,255,255,.07) 38%,
            rgba(255,255,255,0) 72%
        ),

        radial-gradient(
            ellipse 54% 7% at 42% 82%,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,.06) 40%,
            rgba(255,255,255,0) 74%
        );

    opacity: .78;

    filter:
        blur(.2px);

    animation:
        waterDrift
        17s ease-in-out infinite;
}


/* =========================================================
   Light Surfaces
========================================================= */

.scene.light .surface-far {

    position: absolute;

    left: -10%;
    right: -10%;

    top: 8%;
    height: 25%;

    background:
        repeating-radial-gradient(
            ellipse at 50% 0%,

.scene.light .surface-near {

========================================================= */

========================================================= */

/* =========================================================
   Island Reflection
========================================================= */

.island-shadow {

    position: absolute;

    left: 50%;

    /*
     * Almost directly under the horizon.
     *
     * Horizon = 37.5vh
     * Reflection = +1px
     */
    top:
        calc(
            37.5vh
            + var(--reflection-offset)
        );

    width:
        calc(var(--island-size) * .88);

    /*
     * Original 108 : 48 ratio preserved.
     */
    aspect-ratio:
        108 / 48;

    height: auto;

    transform:
        translateX(-50%)
        scaleY(.66);

    transform-origin:
        top center;

    z-index: 31;

    pointer-events: none;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center top,
            var(--reflection-main) 0%,
            var(--reflection-mid) 28%,
            var(--reflection-low) 55%,
            transparent 76%
        );

    filter:
        blur(3px);

    opacity: .62;

    animation:
        reflectionPulse
        8s ease-in-out infinite;
}


/*
 * Light reflection:
 * closer to the island and significantly more restrained.
 */

.scene.light .island-shadow {

    width:
        calc(var(--island-size) * .78);

    transform:
        translateX(-50%)
        scaleY(.52);

    background:
        radial-gradient(
            ellipse at center top,
            rgba(63,111,117,.075) 0%,
            rgba(63,111,117,.042) 28%,
            rgba(63,111,117,.016) 54%,
            rgba(63,111,117,0) 76%
        );

    filter:
        blur(2.8px);

    opacity: .52;

    animation:
        reflectionPulseLight
        8s ease-in-out infinite;
}


/* =========================================================
   Reflection Line
========================================================= */

.island-shadow::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 1px;

    width:
        calc(var(--island-size) * .78);

    aspect-ratio:
        92 / 19;

    height: auto;

    transform:
        translateX(-50%);

    border-top:
        1px solid
        var(--reflection-line);

    border-left:
        1px solid
        rgba(180,195,205,.018);

    border-right:
        1px solid
        rgba(180,195,205,.018);

    border-radius: 50%;

    filter:
        blur(.6px);

    animation:
        reflectionLine
        6.5s ease-in-out infinite alternate;
}


/*
 * Light mode line is almost imperceptible.
 */

.scene.light .island-shadow::before {

    width:
        calc(var(--island-size) * .66);

    border-top:

        rgba(72,119,124,.038);

    border-left:

    border-right:

}

<body>

<main class="scene" id="scene">

    <!-- =====================================================
         Theme Toggle
    ====================================================== -->

    <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="テーマをライトモードに切り替える"
        aria-pressed="false"
    >
        <span class="theme-icon"></span>
    </button>


    <!-- =====================================================
         Atmosphere / Stars
    ====================================================== -->

    <div class="atmosphere"></div>


    <!-- =====================================================
         Island
    ====================================================== -->

    <div class="island-window">

        <div class="island"></div>

    </div>


    <!-- =====================================================
         Island / Horizon Gap
    ====================================================== -->

    <div class="island-gap-mist"></div>


    <!-- =====================================================
         Horizon
    ====================================================== -->

    <div class="horizon"></div>


    <!-- =====================================================
         Ocean
    ====================================================== -->

    <div class="ocean">

        <div class="water-gaps"></div>

        <div class="ocean-mist"></div>

        <div class="water"></div>

        <div class="surface-far"></div>

        <div class="surface-mid"></div>

        <div class="surface-near"></div>

    </div>


    <!-- =====================================================
         Island Reflection
    ====================================================== -->

    <div class="island-shadow"></div>


    <!-- =====================================================
         Brand
    ====================================================== -->

    <div class="brand">

        <h1 class="brand-name">
            esenus
        </h1>

        <div class="brand-status">

            <span class="status-dot"></span>

            awaiting initialization

        </div>

    </div>

</main>


<script>

(function () {

    const scene =
        document.getElementById("scene");

    const toggle =
        document.getElementById("themeToggle");


    /*
     * Restore previously selected theme.
     *
     * Default:
     * dark
     */

    const savedTheme =
        localStorage.getItem("esenus-theme");


    if (savedTheme === "light") {

        scene.classList.add("light");

    }


    function updateButton() {

        const isLight =
            scene.classList.contains("light");


        toggle.setAttribute(
            "aria-pressed",
            String(isLight)
        );


        toggle.setAttribute(
            "aria-label",
            isLight
                ? "テーマをダークモードに切り替える"
                : "テーマをライトモードに切り替える"
        );

    }


    toggle.addEventListener(
        "click",
        function () {

            const isLight =
                scene.classList.toggle("light");


            localStorage.setItem(
                "esenus-theme",
                isLight
                    ? "light"
                    : "dark"
            );


            updateButton();

        }
    );


    updateButton();

})();

</script>
